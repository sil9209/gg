/* Classic baseball management theme, custom original artwork */
:root{--bg:#07111d;--surface:#10243b;--light:#1d3959;--line:#375578;--muted:#b5c9da}
body{background:radial-gradient(ellipse at 60% 0%,#244e83 0,#071523 58%,#06101b 100%);}
.top{background:linear-gradient(180deg,#18365d,#0b1c33);border-bottom:3px solid #3b67a0;box-shadow:0 5px 18px #0008}
.head{min-height:92px}.brand-logo{font-size:23px}.brand-logo .ball{width:48px;height:48px;font-size:25px}
.layout{display:block}.nav{display:flex;flex-direction:row;gap:0;padding:0;margin-bottom:19px;overflow:auto;background:linear-gradient(#183a64,#0a1d33);border:1px solid #47658b;border-radius:11px;box-shadow:0 8px 22px #0006}
.nav button{flex:1;text-align:center;min-width:112px;border:0;border-right:1px solid #385675;border-radius:0;background:transparent;font-size:15px;padding:16px 11px;white-space:nowrap}
.nav button.active{background:linear-gradient(#286fc3,#154785);box-shadow:inset 0 0 0 1px #659ee9;border-bottom:3px solid #a8d3ff}
.panel{background:linear-gradient(155deg,#182f4c,#0e2137 80%);border-color:#41628a;box-shadow:inset 0 1px #ffffff12,0 5px 15px #0005}
.sectiontitle{color:#eef7ff;border-bottom:2px solid #3d6595;padding-bottom:11px;font-size:23px}
.club-home{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:17px}
.club-home .stadium{height:355px;min-height:0;border:2px solid #587ca4;position:relative;overflow:hidden;display:block;text-align:left;padding:0;background:radial-gradient(ellipse 110% 56% at 50% 85%,#245335 0 33%,#133f30 54%,transparent 55%),linear-gradient(180deg,#1d335d 0,#425d80 38%,#101e31 39%,#152842 48%,#122638 100%);box-shadow:inset 0 3px 30px #0008}
.stadium::before{content:"";position:absolute;bottom:-75px;left:50%;width:330px;height:330px;transform:translateX(-50%) rotate(45deg) scaleY(.72);background:linear-gradient(135deg,#b89b72 0 10%,#2e6e46 10% 75%,#b89b72 75% 100%);border:8px solid #ccbb93;box-shadow:0 0 25px #0008}
.stadium::after{content:"";position:absolute;left:7%;right:7%;top:42%;height:9px;background:repeating-linear-gradient(90deg,#f5ffff 0 3px,#bed9e6 3px 5px,transparent 5px 10px);filter:drop-shadow(0 0 8px white)}
.stadium .stadium-overlay{position:absolute;z-index:2;inset:0;background:linear-gradient(90deg,#071526d9,transparent 85%);padding:25px}
.stadium .stadium-overlay h2{font-size:31px;margin:18px 0}
.stadium .stadium-overlay button{font-size:16px;background:linear-gradient(#3282ec,#174d9e);border:1px solid #8cb9ff;box-shadow:0 3px 10px #0008}
.home-right .panel{margin-bottom:12px}.home-right h3{margin:0 0 11px;color:#d0e6ff}.home-right .item{padding:9px 2px}
.classic-shortcuts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:17px}
.classic-shortcuts button{min-height:108px;background:linear-gradient(155deg,#244975,#112a48);border:1px solid #5277aa;border-radius:9px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 1px #ffffff26}
.classic-shortcuts span{font-size:30px}
.scoreboard{font-variant-numeric:tabular-nums;border:1px solid #456e98;background:#091b30;border-radius:10px;overflow:auto}
.scoreboard table{width:100%}.scoreboard th{background:#153454}.scoreboard td,.scoreboard th{padding:11px 13px}
.scoreboard tr:nth-child(even){background:#ffffff07}
.classic-subtitle{font-weight:800;color:#f0cb77;margin:0 0 8px;letter-spacing:.02em}

@media(max-width:650px){.nav{position:sticky;top:0;z-index:7}.nav button{flex:none;min-width:102px;font-size:13px;padding:12px 9px}.club-home .stadium{height:265px}.stadium .stadium-overlay h2{font-size:23px}.classic-shortcuts{grid-template-columns:repeat(3,minmax(0,1fr))}.classic-shortcuts button{min-height:80px}.home-right{grid-template-columns:1fr}.head{min-height:75px}}

/* DIAMOND GM — light baseball management interface revision */
:root{color-scheme:light;--bg:#f4f7fb;--surface:#ffffff;--light:#edf3fa;--line:#dce5f0;--text:#1d3048;--muted:#6b7e94;--primary:#2665bd;--gold:#b67a16}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,#eaf2fc 0,#f7f9fd 225px,#f4f7fb 100%);color:var(--text);font-size:14px;line-height:1.6}
.shell{max-width:1380px;padding:0 clamp(16px,3.4vw,48px)}
.top{background:#fff;border-bottom:1px solid #dee7f1;box-shadow:0 2px 16px #1e46760d}
.head{min-height:88px;gap:24px}
.brand-logo{color:#244c7f;text-shadow:none;font-size:22px}
.brand-logo b{color:#244c7f}.brand-logo em{color:#2978bc}.brand-logo small{color:#738ca8}
.brand-logo .ball{background:#fff;box-shadow:0 0 0 3px #edf4fb,0 2px 8px #1a508922}
.stats{gap:10px;align-items:center}
.pill{background:#f5f8fc;border-color:#dde7f2;color:#344c68;border-radius:11px;padding:9px 13px}
button{border:1px solid #d1deeb;border-radius:10px;background:#f4f8fd;color:#2c4b6f;min-height:38px;font-weight:650;transition:background .15s,border-color .15s,transform .15s}
button:hover{background:#e7f2ff;border-color:#a9c8ee;filter:none}
button:active{transform:translateY(1px)}
.primary,.stadium .stadium-overlay button{background:#286bbb;color:#fff;border-color:#286bbb;box-shadow:0 3px 8px #286bbb28}
.primary:hover,.stadium .stadium-overlay button:hover{background:#17559e}
input,select{background:#fff;border:1px solid #cad7e7;color:#203853;border-radius:9px;min-height:40px}
input:focus,select:focus{outline:2px solid #8ab8f2;outline-offset:1px}
main{padding-top:24px}
.nav{margin:0 0 26px;background:#fff;border:1px solid #d9e4ef;border-radius:12px;gap:6px;padding:7px;box-shadow:0 3px 14px #1a4a7810}
.nav button{color:#536a83;font-size:14px;font-weight:700;min-width:105px;padding:13px 10px;border:0;border-radius:9px;background:transparent}
.nav button.active{color:#fff;background:#276cbd;border:0;box-shadow:0 3px 9px #276cbd36}
.nav button:not(.active):hover{background:#eef5fc}
.panel{background:#fff;border:1px solid #dce6f0;border-radius:15px;padding:clamp(17px,2vw,27px);box-shadow:0 5px 22px #1b456e0b;margin-bottom:20px}
.panel h3{font-size:17px;line-height:1.4;color:#233f5e;margin:0 0 16px}
.sectiontitle{font-size:22px;color:#1a3757;border-bottom:0;margin:3px 0 19px;padding:0;letter-spacing:-.03em}
.grid{gap:15px}
.metric{background:#f4f8fc;border:1px solid #e4ecf5;border-radius:12px;padding:18px;color:#5a718b}
.metric strong{color:#213a59;font-size:24px;margin-top:9px}
.item{gap:18px;border-bottom:1px solid #edf1f6;padding:13px 0}
.item b{color:#203b5b}
.muted,small{color:var(--muted)}
.grade{background:#e5ebf4;color:#445d7a}
.grade.A{background:#fff0cb;color:#98630b}
.grade.B{background:#d9f2f2;color:#12757c}
.grade.C{background:#e3eeff;color:#2e70ae}
.club-home{grid-template-columns:minmax(0,1.9fr) minmax(270px,.9fr);gap:21px}
.club-home .stadium{height:365px;border:1px solid #bcd3e6;border-radius:16px;background:
radial-gradient(ellipse 80% 29% at 50% 92%,#56a55f 0 55%,#328a53 56% 73%,transparent 74%),
linear-gradient(180deg,#8dc9f0 0,#c4e7fb 44%,#8fb9c4 44%,#d1dedc 48%,#2e7b50 49%,#26764a 100%);
box-shadow:0 10px 30px #2b53722b;position:relative}
.club-home .stadium::before{background:linear-gradient(135deg,#d8b784 0 12%,#68ae6b 12% 75%,#c59a69 75% 100%);border-color:#e4c89b;bottom:-115px}
.club-home .stadium::after{background:repeating-linear-gradient(90deg,#fff 0 3px,#f3faff 3px 5px,transparent 5px 12px);top:42%;opacity:.86}
.stadium .stadium-overlay{background:linear-gradient(90deg,#12395eeb 0,#12395ec9 33%,#12395e55 64%,transparent 100%);padding:clamp(22px,2.6vw,38px)}
.stadium .stadium-overlay h2{font-size:clamp(24px,2.8vw,35px);font-weight:850;color:white;line-height:1.25;max-width:500px;margin:19px 0}

.classic-subtitle{color:#ffe5a3;letter-spacing:.08em}

.home-right .panel{margin-bottom:15px}
.home-right h3{color:#2a496b;font-size:16px}
.scoreboard{background:#fff;border-color:#dee8f1;border-radius:12px}
.scoreboard th{background:#edf4fc;color:#486581}
.scoreboard td{color:#263e5c}
.scoreboard tr:nth-child(even){background:#f7faff}
table th,table td{border-bottom:1px solid #e7edf5;padding:12px 14px}

.card{background:#f5f9fd;border-color:#e1eaf4}
.auth{margin:7vh auto;max-width:460px}
.auth h1{color:#203e61}
.auth input{min-height:46px}

.msg{background:#fff;color:#234763;border-color:#a8c9e7;box-shadow:0 8px 32px #1b4b7840}

/* Franchise identity, original emblems, and pre-login team selector */
:root{--team-accent:#286bbb;--team-alt:#164d8a}
body{font-family:Inter,Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif}
button.primary,.primary,.nav button.active{background:var(--team-accent);border-color:var(--team-accent);color:white}
button.primary:hover,.primary:hover{background:var(--team-alt);border-color:var(--team-alt);color:white}
.nav button.active{box-shadow:0 4px 12px color-mix(in srgb,var(--team-accent) 30%,transparent)}
.stadium .stadium-overlay button{background:var(--team-accent);border-color:var(--team-accent)}
.stadium .stadium-overlay button:hover{background:var(--team-alt)}
.classic-shortcuts button:hover{border-color:var(--team-accent);color:var(--team-accent)}
.team-crest{display:inline-flex;align-items:center;justify-content:center;position:relative;width:77px;height:86px;flex:none;clip-path:polygon(50% 0%,96% 18%,93% 70%,50% 100%,7% 70%,4% 18%);background:linear-gradient(130deg,var(--crest-alt),var(--crest) 67%,var(--crest-alt));filter:drop-shadow(0 3px 4px #19334a26);color:#fff;box-shadow:inset 0 0 0 4px #fff8}
.team-crest::before{content:"";position:absolute;inset:6px;clip-path:inherit;border:2px solid #ffffff70;background:linear-gradient(150deg,#ffffff27,#ffffff00 55%);opacity:.85}
.crest-letter{font-size:38px;line-height:1;font-family:Georgia,serif;font-weight:950;font-style:italic;text-shadow:2px 3px 0 #0005;z-index:2}
.crest-light{position:absolute;top:8px;right:17px;font-size:11px;color:#ffebad;z-index:2}
.team-crest.small{width:30px;height:35px}
.team-crest.small .crest-letter{font-size:18px}
.team-crest.small .crest-light{display:none}
.header-team{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--team-accent) 8%,white);padding:5px 10px;border:1px solid color-mix(in srgb,var(--team-accent) 20%,white);border-radius:9px;color:var(--team-accent)}
.team-page{padding-top:32px;padding-bottom:80px}
.team-intro{text-align:center;max-width:780px;margin:0 auto 35px}

.team-choice::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--team-accent)}

.team-choice .team-info{display:flex;align-items:center;flex-direction:column;gap:3px;min-width:0}

.team-pick-arrow{font-weight:750;font-size:11px;color:var(--team-accent);margin-top:4px}
.team-disclaimer{text-align:center;font-size:12px;color:#8797a9;margin-top:25px}
.auth-layout{display:grid;grid-template-columns:1.05fr .9fr;gap:24px;align-items:stretch;max-width:1050px;margin:5vh auto}
.auth-showcase{border-radius:20px;background:linear-gradient(145deg,var(--team-alt) 0,var(--team-accent) 88%);color:white;min-height:490px;padding:50px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}

.auth-showcase p{font-size:17px;color:#fff;line-height:1.7}
.auth-showcase-desc{letter-spacing:.13em;font-size:10px;opacity:.75;margin-top:25px}
.auth-modern{margin:0;max-width:none;display:flex;flex-direction:column;justify-content:center;padding:clamp(25px,3vw,46px)}
.auth-modern h1{margin:12px 0 0;font-size:28px}
.auth-modern form{margin-top:20px}
.auth-modern form label{font-size:12px;font-weight:800;color:#46617b;display:block;margin:13px 0}
.auth-modern form input{width:100%;margin:6px 0 0}

.lineup-crowd{position:absolute;top:16%;left:-7%;width:114%;height:18%;border-radius:0 0 55% 55%;background:repeating-linear-gradient(100deg,#20384c 0 7px,#647d81 7px 10px,#2c5275 10px 13px,#a4b2a4 13px 15px);opacity:.8;box-shadow:0 6px 0 #cbd9dc;transform:perspective(800px) rotateX(23deg)}
.lineup-turf{position:absolute;inset:27% -15% -12%;border-radius:50% 50% 0 0;background:repeating-linear-gradient(105deg,#338346 0 55px,#3a9553 55px 110px);box-shadow:inset 0 28px 35px #0002;transform:perspective(730px) rotateX(13deg)}
.lineup-infield{position:absolute;left:50%;top:65%;width:55%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg) scaleY(.73);background:#bd9a67;border:7px solid #f5e4c1;box-shadow:0 0 22px #0003,inset 0 0 30px #9f774a}
.lineup-diamond-shape{position:absolute;inset:17%;border:4px solid #eef7e2;background:#348b52;box-shadow:0 0 0 8px #c7ab7b}
.lineup-pitch-mound{position:absolute;left:50%;top:69%;width:10%;height:5%;border-radius:50%;background:#c6a271;transform:translate(-50%,-50%);box-shadow:0 0 0 5px #ead1a6}
.lineup-foul{position:absolute;height:2px;width:70%;background:#f1f8ea;transform-origin:left center;left:50%;top:92%;z-index:1;opacity:.9}.foul-left{transform:rotate(-148deg)}.foul-right{transform:rotate(-32deg)}
.diamond-position{position:absolute;z-index:3;transform:translate(-50%,-50%);min-height:0;width:clamp(72px,9vw,113px);padding:5px;border-radius:10px;background:linear-gradient(150deg,#112f4de8,#0d2237ee);color:#fff;border:1px solid #d8edffb0;box-shadow:0 4px 12px #0008;display:flex;flex-direction:column;gap:1px;align-items:stretch;text-align:center}
.diamond-position:hover{background:#1b547c;color:#fff;transform:translate(-50%,-52%)}.diamond-pos-label{font-size:10px;font-weight:900;color:#f4d17d;align-self:flex-start}.diamond-player-name{font-size:clamp(9px,1vw,12px);font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.diamond-player-grade{font-size:10px;color:#d6e8f7}.pitcher-pin{background:linear-gradient(130deg,#563323ed,#1f2c40ef)}
.lineup-field-summary{display:flex;justify-content:space-around;gap:11px;flex-wrap:wrap;padding:16px;background:#f5f9fe;color:#5f778d;font-size:12px}.lineup-field-summary strong{color:var(--team-accent)}.lineup-help{padding:0 14px;font-size:10px;color:#91a1ae}
.lineup-editor{display:flex;flex-direction:column;gap:13px;min-width:0}.lineup-editor-panel{background:#fff;border:1px solid #dce5ef;border-radius:14px;overflow:hidden;box-shadow:0 5px 15px #203e5a0b}
.lineup-editor-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;background:#ecf4fd;border-bottom:1px solid #dce8f2}.lineup-editor-head h3{margin:0;color:#2b4c6b;font-size:15px}.lineup-editor-head span{font-size:11px;color:#8596a8}
.lineup-edit-list{padding:8px 13px}.lineup-edit-row{display:flex;align-items:center;gap:9px;padding:5px 0}.lineup-edit-row select{min-width:0;flex:1;width:100%;font-size:12px;min-height:37px;padding:6px 8px}
.lineup-order,.lineup-pos-tag,.lineup-pitch-label{flex:none;width:34px;border-radius:7px;background:#e8f1fb;color:#36689f;display:grid;place-items:center;font-weight:850;font-size:12px;min-height:29px}
.lineup-pitch-label{width:70px;font-size:11px}
.lineup-bench-list{max-height:330px;overflow:auto;padding:9px 14px}.lineup-bench-row{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:9px 0;border-bottom:1px solid #edf1f5}.lineup-bench-row:last-child{border:0}.lineup-bench-row>div{display:flex;flex-direction:column;gap:3px;min-width:0}.lineup-bench-row b{font-size:12px}.lineup-bench-row small{font-size:10px}.lineup-bench-row select{width:104px;min-height:35px;font-size:11px;flex:none}
.lineup-reserves{padding:12px 16px;border-top:1px solid #edf1f5}.lineup-reserves strong{font-size:11px}.lineup-reserves>div{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.lineup-reserves span{padding:4px 7px;background:#eff5fc;border-radius:6px;font-size:10px}
.lineup-editor-actions{display:flex;gap:8px}.lineup-editor-actions button{flex:1;min-width:0}
@media(max-width:1050px){.lineup-workspace{grid-template-columns:1fr}.lineup-editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.lineup-editor-actions{grid-column:1/-1}.lineup-field{max-height:650px}}
@media(max-width:650px){.lineup-page-title{align-items:flex-start;flex-wrap:wrap}.lineup-workspace{gap:12px}.lineup-editor{grid-template-columns:1fr}.lineup-editor-actions{grid-column:auto}.lineup-field{min-height:340px;aspect-ratio:1.05}.diamond-position{width:78px}.diamond-player-name{font-size:9px}.lineup-field-head{align-items:flex-start;flex-direction:column;padding:12px 14px;gap:2px}.lineup-field-summary{padding:10px}}
.player-growth-info{padding:15px 27px;background:#f2f7fd;border-top:1px solid #e3ebf3;color:#4b6a86;font-size:12px;line-height:1.9}.player-growth-info strong{color:var(--team-accent)}.player-growth-info small{color:#8495a7}@media(max-width:520px){.player-growth-info{padding:13px 18px}}
.player-portrait{width:38px;height:40px;display:inline-flex;flex:none;overflow:hidden;border-radius:7px;background:#e1edf8;vertical-align:middle}.player-portrait img{height:100%;width:100%;object-fit:cover}.player-portrait.large{width:107px;height:116px;border-radius:11px}.player-portrait.field{width:32px;height:34px;margin:auto}.roster-portrait{display:inline-flex;align-items:center;gap:7px}
.condition-label{font-size:11px;font-weight:850}.cl-1,.cl-2{color:#2877d0}.cl-3{color:#8b929f}.cl-4,.cl-5{color:#d64046}
.friendly-title{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.friendly-title h2{margin:0}.friendly-counter{background:#f2f7fd;border:1px solid #dbe8f3;padding:15px;border-radius:11px;white-space:nowrap;font-size:12px}.friendly-counter strong{display:block;color:var(--team-accent);font-size:24px;text-align:center}
.friendly-form label{display:flex;gap:10px;align-items:center;margin:16px 0}.friendly-form label select{flex:1;min-width:0}.friendly-rewards{display:flex;gap:12px;flex-wrap:wrap}.friendly-rewards label{padding:12px 16px;border:1px solid #dae6f2;background:#f6fafe;border-radius:10px}.friendly-form #friendlyPlay{width:100%;margin:15px 0 6px}
.condition-roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.condition-player{display:flex;align-items:center;gap:8px;border:1px solid #e2eaf4;padding:9px;border-radius:9px;min-width:0}.condition-player>div{flex:1;min-width:0}.condition-player b,.condition-player small{display:block;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.condition-player small{margin-top:5px;color:#8293a6}.condition-player button{font-size:11px;padding:7px 9px}
.friendly-result-overlay{position:fixed;inset:0;z-index:500;background:#122a45ba;display:flex;align-items:center;justify-content:center;padding:15px}.friendly-result-card{background:white;border-radius:16px;padding:24px;width:min(100%,540px);max-height:90vh;overflow-y:auto;text-align:center}.friendly-final-score{font-size:40px;font-weight:1000;color:#244c71}.friendly-result-card>p{color:#8091a2;font-size:13px}.friendly-result-card>strong{color:#278650}.friendly-stat-list{max-height:280px;overflow:auto;text-align:left}.friendly-stat-list>div{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #e7edf3;font-size:12px;gap:8px}.friendly-stat-list small{color:#8495a8}.friendly-stat-list .raise{color:#cf4349}.friendly-stat-list .drop{color:#2877cc}.friendly-result-card>button{width:100%;margin-top:18px}
@media(max-width:600px){.condition-roster{grid-template-columns:1fr}.friendly-form label{flex-wrap:wrap}}

.scout-portrait-wrap{display:flex;align-items:center;justify-content:center;padding:8px 0 12px}.scout-portrait-wrap .player-portrait.large{width:118px;height:131px;border:3px solid #e2eefa;border-radius:16px;box-shadow:0 6px 22px #183d5a21}
.diamond-position .player-portrait.field{width:33px;height:36px;margin:2px auto}
.market-portrait{display:inline-flex;gap:8px;align-items:center}.player-portrait[data-avatar-ready="1"]{background:linear-gradient(145deg,#d3e5f7,#eaf1fa)}

.player-portrait{position:relative;overflow:hidden}.portrait-crest{position:absolute;top:2px;left:2px;z-index:3;display:flex;align-items:center;justify-content:center;width:19px;height:21px;border:1.5px solid white;border-radius:5px;background:var(--crest);color:white;font-size:10px;font-weight:950;box-shadow:0 1px 4px #1115;line-height:1}
.player-portrait.large .portrait-crest{width:29px;height:31px;top:5px;left:5px;font-size:15px;border-radius:8px}.player-portrait.field .portrait-crest{width:13px;height:14px;top:1px;left:1px;font-size:7px;border-radius:3px}
.player-caption{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}.player-caption small{font-size:10px;color:#8996a7;font-weight:600;white-space:nowrap;line-height:1.2}
.scout-popup-dialog #scoutRelease{color:#496276;background:#f0f4f8;border:1px solid #ccd8e5}
.diamond-team-name{font-size:8px;color:#c7d9e9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile-team-name{display:block;color:#8296ad;font-size:12px;margin:-6px 0 9px}
.scout-payment-picker{margin:0 0 25px;padding:20px 23px;background:#fff;border:1px solid #dce6f1;border-radius:15px;box-shadow:0 4px 15px #163b5b10}
.scout-payment-heading{display:flex;justify-content:space-between;align-items:center;gap:10px}.scout-payment-heading h3{margin:0;font-size:17px}.scout-payment-heading span{font-size:11px;color:#8a9bac}
.scout-currency-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:17px}
.scout-currency-tabs button{padding:17px;border-radius:12px;border:1px solid #d8e5f2;background:#f6f9fd;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:#5f7890;transition:background .16s,border-color .16s,transform .16s}
.scout-currency-tabs button:hover{transform:translateY(-2px)}.scout-currency-tabs button.active{border:2px solid var(--team-accent);background:#ecf5ff;color:#1e5e9b;box-shadow:0 3px 12px #1b5b9920}
.scout-currency-tabs button span{font-weight:850;font-size:15px}.scout-currency-tabs button strong{font-size:12px}
.scout-probability{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:17px}
.scout-prob-label{font-size:12px;color:#698197;font-weight:800;margin-right:6px}
.scout-prob-pill{display:inline-flex;gap:10px;align-items:center;border-radius:9px;background:#eff5fc;color:#37688f;padding:8px 12px;font-size:12px;font-weight:750}
.scout-prob-pill strong{color:#1b4e7b;font-size:13px}
.scout-prob-pill.scout-level-9,.scout-prob-pill.scout-level-10{background:#fff0e7;color:#b15a30}
.scout-four-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.scout-four-grid .scout-contract-header{height:85px}.scout-four-grid .scout-contract-body{padding:16px}.scout-four-grid .scout-contract-bottom{gap:7px;flex-wrap:wrap}
.scout-four-grid .scout-contract-bottom button{white-space:nowrap}
.scout-pending-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px;border:1px solid #e6cd87;background:#fff8e8;border-radius:12px;padding:15px;color:#8e6028}
.scout-pending-bar button{background:#aa722d;color:white}
@media(max-width:1050px){.scout-four-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:580px){.scout-four-grid{grid-template-columns:1fr}.scout-payment-heading{display:block}.scout-currency-tabs{grid-template-columns:1fr}}

const LINEUP_POSITIONS=[['CF','중견수',50,19],['LF','좌익수',17,34],['RF','우익수',83,34],['SS','유격수',36,53],['2B','2루수',64,53],['3B','3루수',24,69],['1B','1루수',76,69],['C','포수',50,86],['DH','지명타자',88,87]];
const LINEUP_ROLES=[...Array.from({length:5},(_,i)=>['starter'+(i+1),(i+1)+'선발']),...Array.from({length:4},(_,i)=>['relief'+(i+1),'계투 '+(i+1)]),['setup','셋업'],['closer','마무리']];
let lineupDraft=null,lineupMode='batter',dragBattingIndex=null;
function initLineupDraft(club){
 if(lineupDraft?.clubId===club.id)return;
 const bats=club.players.filter(p=>!p.isPitcher),pitch=club.players.filter(p=>p.isPitcher),batting=(club.lineup||[]).slice(0,9);
 const defense={},used=new Set(),current=club.defensePositions||{},native={'포수':'C','1루수':'1B','2루수':'2B','3루수':'3B','유격수':'SS','좌익수':'LF','중견수':'CF','우익수':'RF'};
 for(const [pos] of LINEUP_POSITIONS){const id=current[pos];if(id&&batting.includes(id)&&!used.has(id)){defense[pos]=id;used.add(id)}}
 for(const id of batting){const pos=native[bats.find(p=>p.id===id)?.pos];if(pos&&!defense[pos]&&!used.has(id)){defense[pos]=id;used.add(id)}}
 for(const [pos]of LINEUP_POSITIONS)if(!defense[pos]){const id=batting.find(v=>!used.has(v));if(id){defense[pos]=id;used.add(id)}}
 let bench=[...new Set((club.benchIds||[]).filter(id=>bats.some(p=>p.id===id)&&!batting.includes(id)))].slice(0,5);
 for(const p of bats)if(bench.length<Math.min(5,bats.length-9)&&!batting.includes(p.id)&&!bench.includes(p.id))bench.push(p.id);
 const rotation={},occupied=new Set(),existing=club.pitcherRotation||{};
 for(const [role]of LINEUP_ROLES){const id=existing[role]||(role==='starter1'?club.pitcher:role==='relief1'?club.pitcherAssignments?.relief:role==='closer'?club.pitcherAssignments?.closer:null);if(id&&pitch.some(p=>p.id===id)&&!occupied.has(id)){rotation[role]=id;occupied.add(id)}}
 for(const [role]of LINEUP_ROLES)if(!rotation[role]){const p=pitch.find(p=>!occupied.has(p.id));if(p){rotation[role]=p.id;occupied.add(p.id)}}
 lineupDraft={clubId:club.id,batting,defense,bench,rotation,dirty:false};
}
function normalizeBench(){
 const d=lineupDraft,bats=state.club.players.filter(p=>!p.isPitcher);
 d.bench=[...new Set(d.bench.filter(id=>bats.some(p=>p.id===id)&&!d.batting.includes(id)))].slice(0,5);
 for(const p of bats)if(d.bench.length<Math.min(5,bats.length-9)&&!d.batting.includes(p.id)&&!d.bench.includes(p.id))d.bench.push(p.id);
}
function replaceDefense(pos,id){
 const d=lineupDraft,previous=d.defense[pos];if(previous===id)return;
 const other=Object.keys(d.defense).find(k=>d.defense[k]===id);
 if(other&&other!==pos){d.defense[other]=previous;d.defense[pos]=id}
 else{const idx=d.batting.indexOf(previous);if(idx>=0)d.batting[idx]=id;d.defense[pos]=id}

}
function replaceRotation(role,id){
 const d=lineupDraft,old=d.rotation[role],other=Object.keys(d.rotation).find(k=>d.rotation[k]===id);
 if(other&&other!==role)d.rotation[other]=old||null;

}

function showScoutResult(p){
 const statMarkup=Object.keys(fieldNames).map(k=>'<div class="scout-result-stat"><span>'+esc(fieldNames[k])+'</span>'+statCell(p[k]??(k==='mental'?p.stamina:55))+'</div>').join('');
 scoutPopup('<div class="scout-popup-header"><span>SCOUT RESULT</span><button type="button" class="scout-info-close" aria-label="안내">✕</button></div><div class="scout-popup-body"><div class="scout-portrait-wrap">'+playerPortrait(p,'large')+'</div><div class="scout-result-eyebrow">새로운 선수 발견 · Lv'+(p.level||'-')+'</div><h2 id="scoutPopupTitle">'+esc(playerLabel(p))+'</h2><p class="scout-popup-caption">'+esc(playerTeamName(p))+'</p><p class="scout-popup-caption">'+esc(p.pos)+' · '+g(p)+' · 종합 '+statCell(overall(p))+'</p><div class="scout-result-stats">'+statMarkup+'</div><div class="scout-popup-actions"><button type="button" id="scoutRelease">방출하기 (+100만원)</button><button type="button" id="scoutRecruit" class="primary">영입하기</button></div></div>');
 document.getElementById('scoutRecruit').onclick=()=>decideScout('recruit');
 document.getElementById('scoutRelease').onclick=()=>decideScout('release');
 document.querySelector('#scoutPopup .scout-info-close').onclick=()=>toast('영입 또는 방출을 선택하세요. 다음에 다시 결정할 수도 있습니다.');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeScoutPopup()});

function findPlayerProfile(id){const club=state.club;return (club?.players||[]).find(p=>p.id===id)||(state.listings||[]).map(l=>l.player).find(p=>p.id===id)||(club?.scoutHistory||[]).map(h=>h.player).find(p=>p.id===id)||null}
function openPlayerProfile(p){
 if(!p)return;
 document.getElementById('playerProfileOverlay')?.remove();
 const t=(state.teams||[]).find(x=>x.id===p.originTeam)||(state.teams||[]).find(x=>x.id===state.club?.teamId);
 const overlay=document.createElement('div');overlay.id='playerProfileOverlay';overlay.className='player-profile-overlay';
 overlay.innerHTML='<div class="player-profile-card" role="dialog" aria-modal="true" aria-label="선수 상세 정보"><div class="player-profile-top"><span>PLAYER INFORMATION</span><button type="button" class="close-profile" aria-label="닫기">✕</button></div><div class="player-profile-overview">'+playerPortrait(p,'large')+'<div><div class="player-profile-role">'+esc(p.pos)+' · '+shortYear(p)+' 시즌</div><h2>'+esc(playerLabel(p))+'</h2><small class="profile-team-name">'+esc(playerTeamName(p))+'</small><div class="player-profile-meta">'+conditionLabel(p)+' '+g(p)+' <span>종합 '+statCell(overall(p))+'</span><span>'+(t?esc(t.name):'가상 선수')+'</span></div></div></div><div class="player-growth-info"><strong>기본 성장</strong> · '+esc(fieldNames[p.growthFocus]||'정확')+' +0.02 / 구단 경기 1회 <small>(A~E 공통 · 비출전 포함)</small><br><strong>출전 성장</strong> · '+(p.grade==='A'&&p.age>=36?'36세부터 A등급 출전 성장 중단':'등급·나이에 따라 출전 선수만 추가 성장')+'</div><div class="player-profile-stats"><h3>선수 능력치</h3>'+Object.keys(fieldNames).map(k=>{const val=Number(p[k]??(k==='mental'?p.stamina:55))||0;return '<div class="player-profile-stat"><span>'+fieldNames[k]+'</span><div class="player-profile-bar stat-bg-'+statColor(val)+'"><div style="width:'+Math.min(100,val)+'%"></div></div><strong>'+statCell(val)+'</strong></div>'}).join('')+'</div><div class="player-profile-bottom"><span>연도 '+shortYear(p)+' · 나이 '+getAge(p)+'세 · '+esc(p.pos)+'</span><button type="button" class="close-profile">닫기</button></div></div>';
 document.body.appendChild(overlay);const close=()=>overlay.remove();overlay.addEventListener('click',e=>{if(e.target===overlay)close()});overlay.querySelectorAll('.close-profile').forEach(b=>b.onclick=close);overlay.querySelector('.close-profile').focus();
}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-profile]');if(btn){e.preventDefault();e.stopPropagation();openPlayerProfile(findPlayerProfile(btn.dataset.profile))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('playerProfileOverlay')?.remove()});


/* Casual browser shortcut and content-drag deterrents. This cannot disable browser devtools globally. */
document.addEventListener('keydown',event=>{
 const key=String(event.key||'').toLowerCase();
 const mod=event.ctrlKey||event.metaKey,shift=event.shiftKey;
 const developerShortcut=key==='f12'||(mod&&shift&&['i','j','c','k'].includes(key))||(mod&&['u','s'].includes(key))||(event.metaKey&&event.altKey&&['i','j','c'].includes(key));
 if(developerShortcut){event.preventDefault();event.stopImmediatePropagation()}
},true);
document.addEventListener('contextmenu',event=>{
 if(!event.target.closest?.('input,textarea,select,[contenteditable="true"]'))event.preventDefault()
},true);
document.addEventListener('dragstart',event=>{
 if(!event.target.closest?.('.lineup-drag-item'))event.preventDefault();
},true);
document.addEventListener('selectstart',event=>{
 if(!event.target.closest?.('input,textarea,select,[contenteditable="true"]'))event.preventDefault();
},true);

function render(){theme();if(!state.user)return selectedTeam?login():selectTeam();if(!state.club)return create();root()}start();
</script></body></html>
