<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIAMOND GM | 야구 구단 경영</title><style>
:root{color-scheme:dark;--bg:#0b1424;--surface:#17243b;--light:#223550;--line:#354965;--text:#ecf3ff;--muted:#9aabc1;--primary:#4f9aff;--gold:#f4c778}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0b1424,#121e35 70%);color:var(--text);font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:var(--light);color:var(--text)}button:hover{filter:brightness(1.15)}button:disabled{opacity:.4;cursor:default}.primary{background:#256ee5;border-color:#256ee5;color:white}input,select{border:1px solid var(--line);background:#101d31;border-radius:9px;padding:10px;color:white;min-width:0}.shell{max-width:1450px;margin:auto;padding:0 24px}.top{border-bottom:1px solid var(--line);background:#111d32;position:sticky;top:0;z-index:5}.head{min-height:66px;display:flex;align-items:center;gap:18px;justify-content:space-between}.brand{font-size:22px;font-weight:900;letter-spacing:.04em}.brand span{color:var(--gold)}.muted{color:var(--muted)}.stats{display:flex;gap:16px;flex-wrap:wrap}.pill{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px}main{padding:24px 0 90px}.layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px}.nav{display:flex;flex-direction:column;gap:9px}.nav button{text-align:left;padding:14px;border-radius:10px}.nav button.active{border-color:#4f9aff;background:#163963}.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 6px 22px #0002}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.metric{background:#101e32;padding:17px;border-radius:12px}.metric strong{display:block;font-size:23px;margin-top:7px}.sectiontitle{font-size:21px;margin:0 0 14px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.toolbar>*{max-width:100%}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left}th{color:#abc0da;font-size:12px;font-weight:600}td small{color:var(--muted)}.grade{display:inline-block;border-radius:6px;padding:3px 8px;font-weight:800;background:#3f516b}.grade.A{background:#704a15;color:#ffe6a1}.grade.B{background:#1c5960;color:#aaf9f2}.grade.C{background:#2b4369;color:#b2d2ff}.msg{position:fixed;bottom:22px;right:24px;z-index:15;padding:15px 21px;background:#254e73;border:1px solid #67a1ee;border-radius:12px;box-shadow:0 10px 30px #0008;max-width:calc(100vw - 36px)}.auth{max-width:450px;margin:8vh auto}.auth input{display:block;width:100%;margin:12px 0}.auth button{width:100%;margin-top:8px;padding:12px}.card{background:#101e32;border:1px solid var(--line);padding:14px;border-radius:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-bottom:1px solid var(--line)}.item:last-child{border:0}.badge{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:3px 6px}.highlight{color:var(--gold)}@media(max-width:880px){.shell{padding:0 12px}.layout{grid-template-columns:1fr}.nav{display:flex;flex-direction:row;overflow:auto;position:sticky;top:64px;z-index:4;background:var(--bg);padding:8px 0}.nav button{flex:none;white-space:nowrap;padding:10px}.head{align-items:flex-start;padding:12px 0;gap:8px;flex-direction:column}.top{position:relative}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.panel{padding:14px}main{padding-top:12px}.stats{font-size:12px;gap:6px}.stats .pill{padding:6px 8px}}@media(max-width:440px){.grid{grid-template-columns:1fr 1fr}.metric{padding:12px}.metric strong{font-size:19px}.brand{font-size:19px}button{padding:7px}}
</style></head><body><div id="app"></div><script>
const app=document.getElementById('app');let state={user:null},tab='home',filter='',marketPos='전체',grade='전체',sort='overall';
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const money=n=>Number(n||0).toLocaleString('ko-KR')+'원';const overall=p=>Math.round((p.power+p.contact+p.eye+p.speed+p.defense+p.stamina)/6);
const fieldNames={power:'파워',contact:'정확',eye:'선구',speed:'주력',defense:'수비',stamina:'체력'};
const g=p=>'<span class="grade '+esc(p.grade)+'">'+esc(p.grade)+'</span>';
function toast(txt){document.querySelector('.msg')?.remove();let x=document.createElement('div');x.className='msg';x.textContent=txt;document.body.append(x);setTimeout(()=>x.remove(),3500)}
async function api(body){try{const r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const x=await r.json();if(!r.ok)throw Error(x.error||'오류');state=x;if(x.result?.message)toast(x.result.message);render()}catch(e){toast(e.message)}}
async function start(){try{state=await(await fetch('/api/state')).json()}catch(e){toast('서버에 연결할 수 없습니다')}render()}
function login(){app.innerHTML='<header class="top"><div class="shell head"><div class="brand">⚾ DIAMOND <span>GM</span></div><div class="muted">온라인 야구 구단 경영 테스트</div></div></header><main class="shell"><div class="panel auth"><h1>구단주 로그인</h1><p class="muted">새 계정을 만들거나 기존 계정으로 접속하세요.</p><form id="auth"><input name="username" placeholder="아이디 (3~20자)" required minlength="3"><input name="password" placeholder="비밀번호 (6자 이상)" type="password" required minlength="6"><button class="primary" value="login">로그인</button><button value="register">회원가입</button></form><p class="muted" style="margin-top:22px;font-size:12px">테스트 서버 · 계정과 선수 기록은 정식 서비스 이전에 초기화될 수 있습니다.</p></div></main>';document.querySelector('#auth').addEventListener('click',e=>{if(e.target.tagName==='BUTTON'){e.preventDefault();const f=document.getElementById('auth');api({type:e.target.value,username:f.username.value,password:f.password.value})}})}
function create(){app.innerHTML='<header class="top"><div class="shell head"><div class="brand">⚾ DIAMOND <span>GM</span></div><button onclick="api({type:\'logout\'})">로그아웃</button></div></header><main class="shell"><div class="panel auth"><h1>새 구단 창단</h1><p>게임머니 <b class="highlight">5억원</b> · <b class="highlight">300 CP</b> · 2000~2026 시즌 가상 선수 25명 지급</p><form id="clubForm"><input name="club" placeholder="구단명 입력 (2~20자)" minlength="2" maxlength="20" required><button class="primary">구단 창단하기</button></form></div></main>';document.getElementById('clubForm').onsubmit=e=>{e.preventDefault();api({type:'createClub',name:e.target.club.value})}}
const tabs=[['home','🏠 대시보드'],['roster','👥 선수단'],['train','⬆️ 선수 육성'],['lineup','🧢 라인업'],['market','🔄 이적시장'],['league','🏆 리그']];
function root(){const c=state.club;app.innerHTML='<header class="top"><div class="shell head"><div class="brand">⚾ DIAMOND <span>GM</span></div><div class="stats"><span class="pill">🏟 '+esc(c.name)+'</span><span class="pill">💰 '+money(c.cash)+'</span><span class="pill">💎 '+c.cp+' CP</span><button onclick="api({type:\'logout\'})">로그아웃</button></div></div></header><main class="shell layout"><aside class="nav">'+tabs.map(t=>'<button class="'+(t[0]===tab?'active':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join('')+'</aside><section id="content"></section></main>';document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;root()});content()}
function getP(){return state.club.players.filter(p=>!filter||(p.name+p.year+p.pos).includes(filter)).sort((a,b)=>sort==='overall'?overall(b)-overall(a):sort==='year'?b.year-a.year:a.name.localeCompare(b.name))}
function table(players,actions){return '<div class="scroll"><table><thead><tr><th>선수</th><th>연도</th><th>포지션</th><th>등급</th><th>종합</th><th>파워</th><th>정확</th><th>선구</th><th>주력</th><th>수비</th><th>체력</th>'+(actions?'<th>관리</th>':'')+'</tr></thead><tbody>'+players.map(p=>'<tr><td><b>'+esc(p.name)+'</b></td><td>'+p.year+'</td><td>'+esc(p.pos)+'</td><td>'+g(p)+'</td><td><b>'+overall(p)+'</b></td>'+Object.keys(fieldNames).map(k=>'<td>'+p[k]+'</td>').join('')+(actions?'<td><button data-player="'+p.id+'" data-action="detail">관리</button></td>':'')+'</tr>').join('')+'</tbody></table></div>'}
function content(){const c=state.club,el=document.getElementById('content');if(tab==='home'){el.innerHTML='<h2 class="sectiontitle">구단 대시보드</h2><div class="grid">'+[['보유 선수',c.players.length+'명'],['리그 성적',c.wins+'승 '+c.losses+'패'],['시즌','시즌 '+c.season],['이적시장 매물',(state.listings||[]).length+'건']].map(x=>'<div class="metric">'+x[0]+'<strong>'+x[1]+'</strong></div>').join('')+'</div><div class="panel" style="margin-top:18px"><h3>구단 운영</h3><p class="muted">스카우트와 경기 보상으로 구단을 성장시키세요. 선수를 키운 후 다른 구단주와 거래할 수 있습니다.</p><button class="primary" id="scout">🎯 선수 스카우트 (500만원)</button> <button id="playHome">⚾ AI 구단과 경기</button></div><div class="panel"><h3>최근 영입/거래 기록</h3>'+(c.transactions.length?c.transactions.slice(0,10).map(x=>'<div class="item">'+esc(x.type)+' '+esc(x.name)+' <b>'+money(x.price)+'</b></div>').join(''):'<p class="muted">거래 내역이 없습니다.</p>')+'</div>';document.getElementById('scout').onclick=()=>api({type:'scout'});document.getElementById('playHome').onclick=()=>api({type:'play'});return}
if(tab==='roster'){el.innerHTML='<h2 class="sectiontitle">선수단 관리 <small class="muted">'+c.players.length+'/80</small></h2><div class="panel"><div class="toolbar"><input id="findPlayer" placeholder="선수명/연도/포지션 검색" value="'+esc(filter)+'"><select id="sortPlayer"><option value="overall">종합 능력치순</option><option value="year">최신 연도순</option><option value="name">이름순</option></select><button id="scout">스카우트 (500만원)</button></div><div id="rosterTable">'+table(getP(),true)+'</div></div><div id="playerDetail"></div>';document.getElementById('findPlayer').oninput=e=>{filter=e.target.value;document.getElementById('rosterTable').innerHTML=table(getP(),true);bindDetail()};document.getElementById('sortPlayer').value=sort;document.getElementById('sortPlayer').onchange=e=>{sort=e.target.value;content()};document.getElementById('scout').onclick=()=>api({type:'scout'});bindDetail();return}
if(tab==='train'){el.innerHTML='<h2 class="sectiontitle">선수 육성</h2><div class="panel"><p class="muted">등급 성장 비용: 1 CP / 회 · 실패해도 등급이 떨어지지 않습니다.</p><div class="grid">'+[['D → C','50%'],['C → B','25%'],['B → A','10%'],['A','최고 등급']].map(x=>'<div class="metric">'+x[0]+'<strong>'+x[1]+'</strong></div>').join('')+'</div></div><div class="panel">'+c.players.map(p=>'<div class="item"><div><b>'+esc(p.year+' '+p.name)+'</b> '+g(p)+' <small>'+esc(p.pos)+' / 종합 '+overall(p)+'</small></div><button data-upgrade="'+p.id+'" '+(p.grade==='A'||c.cp<1?'disabled':'')+'>성장 1 CP</button></div>').join('')+'</div>';document.querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>api({type:'upgrade',id:b.dataset.upgrade}));return}
if(tab==='lineup'){const bats=c.lineup.map(id=>c.players.find(p=>p.id===id)).filter(Boolean),pitch=c.players.find(p=>p.id===c.pitcher);el.innerHTML='<h2 class="sectiontitle">라인업</h2><div class="panel"><h3>선발 타순</h3>'+bats.map((p,i)=>'<div class="item"><b>'+(i+1)+'번 · '+esc(p.year+' '+p.name)+'</b><select data-slot="'+i+'">'+c.players.filter(x=>!x.isPitcher).map(x=>'<option value="'+x.id+'" '+(x.id===p.id?'selected':'')+'>'+esc(x.name+' ('+x.pos+')')+'</option>').join('')+'</select></div>').join('')+'<h3>선발투수</h3><select id="pitcher">'+c.players.filter(p=>p.isPitcher).map(p=>'<option value="'+p.id+'" '+(p.id===c.pitcher?'selected':'')+'>'+esc(p.year+' '+p.name+' ('+p.pos+')')+'</option>').join('')+'</select></div>';document.querySelectorAll('[data-slot]').forEach(b=>b.onchange=()=>api({type:'lineup',slot:Number(b.dataset.slot),id:b.value}));document.getElementById('pitcher').onchange=e=>api({type:'lineup',id:e.target.value,pitcher:true});return}
if(tab==='market'){let arr=state.listings.filter(l=>(marketPos==='전체'||l.player.pos===marketPos)&&(grade==='전체'||l.player.grade===grade));el.innerHTML='<h2 class="sectiontitle">유저 간 이적시장</h2><div class="panel"><div class="toolbar"><select id="marketPos"><option>전체</option>'+['선발','중계','마무리','포수','1루수','2루수','3루수','유격수','좌익수','중견수','우익수'].map(v=>'<option>'+v+'</option>').join('')+'</select><select id="marketGrade">'+['전체','A','B','C','D'].map(v=>'<option>'+v+'</option>').join('')+'</select><button onclick="content()">새로고침</button></div>'+(arr.length?arr.map(l=>'<div class="item"><div><b>'+esc(l.player.year+' '+l.player.name)+'</b> '+g(l.player)+'<div class="muted">'+esc(l.player.pos)+' · 종합 '+overall(l.player)+' · '+esc(l.sellerName)+'</div></div><div style="text-align:right"><b class="highlight">'+money(l.price)+'</b><div><button data-buy="'+l.id+'">'+(l.seller===state.user.id?'등록 취소':'구매')+'</button></div></div></div>').join(''):'<p class="muted">조건에 맞는 매물이 없습니다.</p>')+'</div><div class="panel"><h3>내 선수 판매하기</h3><div class="toolbar"><select id="sellPlayer">'+c.players.map(p=>'<option value="'+p.id+'">'+esc(p.year+' '+p.name+' '+p.pos+' '+p.grade)+'</option>').join('')+'</select><input id="sellPrice" type="number" min="100000" step="100000" value="10000000" placeholder="판매가 (원)"><button class="primary" id="sell">판매 등록</button></div></div>';document.getElementById('marketPos').value=marketPos;document.getElementById('marketGrade').value=grade;document.getElementById('marketPos').onchange=e=>{marketPos=e.target.value;content()};document.getElementById('marketGrade').onchange=e=>{grade=e.target.value;content()};document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>api({type:b.textContent==='등록 취소'?'cancel':'buy',id:b.dataset.buy}));document.getElementById('sell').onclick=()=>{if(confirm('이 가격에 선수를 등록하시겠습니까?'))api({type:'list',id:document.getElementById('sellPlayer').value,price:Number(document.getElementById('sellPrice').value)})};return}
if(tab==='league'){el.innerHTML='<h2 class="sectiontitle">리그 경기</h2><div class="grid">'+[['승',c.wins],['패',c.losses],['무',c.draws],['시즌',c.season]].map(x=>'<div class="metric">'+x[0]+'<strong>'+x[1]+'</strong></div>').join('')+'</div><div class="panel" style="margin-top:18px"><h3>AI 구단과 경기</h3><p class="muted">라인업과 선수 능력치를 반영한 테스트용 경기 시뮬레이션입니다. 승리 보상: 350만원 + 3 CP</p><button class="primary" id="play">⚾ 경기 진행하기</button></div><div class="panel"><h3>구단주 랭킹</h3>'+state.ranking.map((x,i)=>'<div class="item"><b>'+(i+1)+'. '+esc(x.name)+'</b><span>'+x.wins+'승 '+x.losses+'패</span></div>').join('')+'</div>';document.getElementById('play').onclick=()=>api({type:'play'});return}}
function bindDetail(){document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>{const p=state.club.players.find(x=>x.id===b.dataset.player);const d=document.getElementById('playerDetail');d.innerHTML='<div class="panel"><h3>'+esc(p.year+' '+p.name)+' '+g(p)+'</h3><p class="muted">'+esc(p.pos)+' / 종합 '+overall(p)+'</p><div class="toolbar"><button id="upSelected" '+(p.grade==='A'?'disabled':'')+'>등급 성장 (1 CP)</button>'+Object.keys(fieldNames).map(k=>'<button data-train="'+k+'">'+fieldNames[k]+' 훈련 (100만원)</button>').join('')+'</div></div>';document.getElementById('upSelected').onclick=()=>api({type:'upgrade',id:p.id});document.querySelectorAll('[data-train]').forEach(x=>x.onclick=()=>api({type:'train',id:p.id,key:x.dataset.train}));d.scrollIntoView({behavior:'smooth',block:'nearest'})})}
function render(){if(!state.user)return login();if(!state.club)return create();root()}start();
</script></body></html>
