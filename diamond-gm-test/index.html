/* Classic baseball management theme, custom original artwork */
:root{--bg:#07111d;--surface:#10243b;--light:#1d3959;--line:#375578;--muted:#b5c9da}
body{background:radial-gradient(ellipse at 60% 0%,#244e83 0,#071523 58%,#06101b 100%);}
.top{background:linear-gradient(180deg,#18365d,#0b1c33);border-bottom:3px solid #3b67a0;box-shadow:0 5px 18px #0008}
.head{min-height:92px}.brand-logo{font-size:23px}.brand-logo .ball{width:48px;height:48px;font-size:25px}
.layout{display:block}.nav{display:flex;flex-direction:row;gap:0;padding:0;margin-bottom:19px;overflow:auto;background:linear-gradient(#183a64,#0a1d33);border:1px solid #47658b;border-radius:11px;box-shadow:0 8px 22px #0006}
.nav button{flex:1;text-align:center;min-width:112px;border:0;border-right:1px solid #385675;border-radius:0;background:transparent;font-size:15px;padding:16px 11px;white-space:nowrap}
.nav button.active{background:linear-gradient(#286fc3,#154785);box-shadow:inset 0 0 0 1px #659ee9;border-bottom:3px solid #a8d3ff}
.panel{background:linear-gradient(155deg,#182f4c,#0e2137 80%);border-color:#41628a;box-shadow:inset 0 1px #ffffff12,0 5px 15px #0005}
.sectiontitle{color:#eef7ff;border-bottom:2px solid #3d6595;padding-bottom:11px;font-size:23px}
.club-home{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:17px}
.club-home .stadium{height:355px;min-height:0;border:2px solid #587ca4;position:relative;overflow:hidden;display:block;text-align:left;padding:0;background:radial-gradient(ellipse 110% 56% at 50% 85%,#245335 0 33%,#133f30 54%,transparent 55%),linear-gradient(180deg,#1d335d 0,#425d80 38%,#101e31 39%,#152842 48%,#122638 100%);box-shadow:inset 0 3px 30px #0008}
.stadium::before{content:"";position:absolute;bottom:-75px;left:50%;width:330px;height:330px;transform:translateX(-50%) rotate(45deg) scaleY(.72);background:linear-gradient(135deg,#b89b72 0 10%,#2e6e46 10% 75%,#b89b72 75% 100%);border:8px solid #ccbb93;box-shadow:0 0 25px #0008}
.stadium::after{content:"";position:absolute;left:7%;right:7%;top:42%;height:9px;background:repeating-linear-gradient(90deg,#f5ffff 0 3px,#bed9e6 3px 5px,transparent 5px 10px);filter:drop-shadow(0 0 8px white)}
.stadium .stadium-overlay{position:absolute;z-index:2;inset:0;background:linear-gradient(90deg,#071526d9,transparent 85%);padding:25px}
.stadium .stadium-overlay h2{font-size:31px;margin:18px 0}
.stadium .stadium-overlay button{font-size:16px;background:linear-gradient(#3282ec,#174d9e);border:1px solid #8cb9ff;box-shadow:0 3px 10px #0008}
.home-right .panel{margin-bottom:12px}.home-right h3{margin:0 0 11px;color:#d0e6ff}.home-right .item{padding:9px 2px}
.classic-shortcuts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:17px}
.classic-shortcuts button{min-height:108px;background:linear-gradient(155deg,#244975,#112a48);border:1px solid #5277aa;border-radius:9px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 1px #ffffff26}
.classic-shortcuts span{font-size:30px}
.scoreboard{font-variant-numeric:tabular-nums;border:1px solid #456e98;background:#091b30;border-radius:10px;overflow:auto}
.scoreboard table{width:100%}.scoreboard th{background:#153454}.scoreboard td,.scoreboard th{padding:11px 13px}
.scoreboard tr:nth-child(even){background:#ffffff07}
.classic-subtitle{font-weight:800;color:#f0cb77;margin:0 0 8px;letter-spacing:.02em}

@media(max-width:650px){.nav{position:sticky;top:0;z-index:7}.nav button{flex:none;min-width:102px;font-size:13px;padding:12px 9px}.club-home .stadium{height:265px}.stadium .stadium-overlay h2{font-size:23px}.classic-shortcuts{grid-template-columns:repeat(3,minmax(0,1fr))}.classic-shortcuts button{min-height:80px}.home-right{grid-template-columns:1fr}.head{min-height:75px}}

/* DIAMOND GM — light baseball management interface revision */
:root{color-scheme:light;--bg:#f4f7fb;--surface:#ffffff;--light:#edf3fa;--line:#dce5f0;--text:#1d3048;--muted:#6b7e94;--primary:#2665bd;--gold:#b67a16}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,#eaf2fc 0,#f7f9fd 225px,#f4f7fb 100%);color:var(--text);font-size:14px;line-height:1.6}
.shell{max-width:1380px;padding:0 clamp(16px,3.4vw,48px)}
.top{background:#fff;border-bottom:1px solid #dee7f1;box-shadow:0 2px 16px #1e46760d}
.head{min-height:88px;gap:24px}
.brand-logo{color:#244c7f;text-shadow:none;font-size:22px}
.brand-logo b{color:#244c7f}.brand-logo em{color:#2978bc}.brand-logo small{color:#738ca8}
.brand-logo .ball{background:#fff;box-shadow:0 0 0 3px #edf4fb,0 2px 8px #1a508922}
.stats{gap:10px;align-items:center}
.pill{background:#f5f8fc;border-color:#dde7f2;color:#344c68;border-radius:11px;padding:9px 13px}
button{border:1px solid #d1deeb;border-radius:10px;background:#f4f8fd;color:#2c4b6f;min-height:38px;font-weight:650;transition:background .15s,border-color .15s,transform .15s}
button:hover{background:#e7f2ff;border-color:#a9c8ee;filter:none}
button:active{transform:translateY(1px)}
.primary,.stadium .stadium-overlay button{background:#286bbb;color:#fff;border-color:#286bbb;box-shadow:0 3px 8px #286bbb28}
.primary:hover,.stadium .stadium-overlay button:hover{background:#17559e}
input,select{background:#fff;border:1px solid #cad7e7;color:#203853;border-radius:9px;min-height:40px}
input:focus,select:focus{outline:2px solid #8ab8f2;outline-offset:1px}
main{padding-top:24px}
.nav{margin:0 0 26px;background:#fff;border:1px solid #d9e4ef;border-radius:12px;gap:6px;padding:7px;box-shadow:0 3px 14px #1a4a7810}
.nav button{color:#536a83;font-size:14px;font-weight:700;min-width:105px;padding:13px 10px;border:0;border-radius:9px;background:transparent}
.nav button.active{color:#fff;background:#276cbd;border:0;box-shadow:0 3px 9px #276cbd36}
.nav button:not(.active):hover{background:#eef5fc}
.panel{background:#fff;border:1px solid #dce6f0;border-radius:15px;padding:clamp(17px,2vw,27px);box-shadow:0 5px 22px #1b456e0b;margin-bottom:20px}
.panel h3{font-size:17px;line-height:1.4;color:#233f5e;margin:0 0 16px}
.sectiontitle{font-size:22px;color:#1a3757;border-bottom:0;margin:3px 0 19px;padding:0;letter-spacing:-.03em}
.grid{gap:15px}
.metric{background:#f4f8fc;border:1px solid #e4ecf5;border-radius:12px;padding:18px;color:#5a718b}
.metric strong{color:#213a59;font-size:24px;margin-top:9px}
.item{gap:18px;border-bottom:1px solid #edf1f6;padding:13px 0}
.item b{color:#203b5b}
.muted,small{color:var(--muted)}
.grade{background:#e5ebf4;color:#445d7a}
.grade.A{background:#fff0cb;color:#98630b}
.grade.B{background:#d9f2f2;color:#12757c}
.grade.C{background:#e3eeff;color:#2e70ae}
.club-home{grid-template-columns:minmax(0,1.9fr) minmax(270px,.9fr);gap:21px}
.club-home .stadium{height:365px;border:1px solid #bcd3e6;border-radius:16px;background:
radial-gradient(ellipse 80% 29% at 50% 92%,#56a55f 0 55%,#328a53 56% 73%,transparent 74%),
linear-gradient(180deg,#8dc9f0 0,#c4e7fb 44%,#8fb9c4 44%,#d1dedc 48%,#2e7b50 49%,#26764a 100%);
box-shadow:0 10px 30px #2b53722b;position:relative}
.club-home .stadium::before{background:linear-gradient(135deg,#d8b784 0 12%,#68ae6b 12% 75%,#c59a69 75% 100%);border-color:#e4c89b;bottom:-115px}
.club-home .stadium::after{background:repeating-linear-gradient(90deg,#fff 0 3px,#f3faff 3px 5px,transparent 5px 12px);top:42%;opacity:.86}
.stadium .stadium-overlay{background:linear-gradient(90deg,#12395eeb 0,#12395ec9 33%,#12395e55 64%,transparent 100%);padding:clamp(22px,2.6vw,38px)}
.stadium .stadium-overlay h2{font-size:clamp(24px,2.8vw,35px);font-weight:850;color:white;line-height:1.25;max-width:500px;margin:19px 0}

.classic-subtitle{color:#ffe5a3;letter-spacing:.08em}

.home-right .panel{margin-bottom:15px}
.home-right h3{color:#2a496b;font-size:16px}
.scoreboard{background:#fff;border-color:#dee8f1;border-radius:12px}
.scoreboard th{background:#edf4fc;color:#486581}
.scoreboard td{color:#263e5c}
.scoreboard tr:nth-child(even){background:#f7faff}
table th,table td{border-bottom:1px solid #e7edf5;padding:12px 14px}

.card{background:#f5f9fd;border-color:#e1eaf4}
.auth{margin:7vh auto;max-width:460px}
.auth h1{color:#203e61}
.auth input{min-height:46px}

.msg{background:#fff;color:#234763;border-color:#a8c9e7;box-shadow:0 8px 32px #1b4b7840}

/* Franchise identity, original emblems, and pre-login team selector */
:root{--team-accent:#286bbb;--team-alt:#164d8a}
body{font-family:Inter,Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif}
button.primary,.primary,.nav button.active{background:var(--team-accent);border-color:var(--team-accent);color:white}
button.primary:hover,.primary:hover{background:var(--team-alt);border-color:var(--team-alt);color:white}
.nav button.active{box-shadow:0 4px 12px color-mix(in srgb,var(--team-accent) 30%,transparent)}
.stadium .stadium-overlay button{background:var(--team-accent);border-color:var(--team-accent)}
.stadium .stadium-overlay button:hover{background:var(--team-alt)}
.classic-shortcuts button:hover{border-color:var(--team-accent);color:var(--team-accent)}
.team-crest{display:inline-flex;align-items:center;justify-content:center;position:relative;width:77px;height:86px;flex:none;clip-path:polygon(50% 0%,96% 18%,93% 70%,50% 100%,7% 70%,4% 18%);background:linear-gradient(130deg,var(--crest-alt),var(--crest) 67%,var(--crest-alt));filter:drop-shadow(0 3px 4px #19334a26);color:#fff;box-shadow:inset 0 0 0 4px #fff8}
.team-crest::before{content:"";position:absolute;inset:6px;clip-path:inherit;border:2px solid #ffffff70;background:linear-gradient(150deg,#ffffff27,#ffffff00 55%);opacity:.85}
.crest-letter{font-size:38px;line-height:1;font-family:Georgia,serif;font-weight:950;font-style:italic;text-shadow:2px 3px 0 #0005;z-index:2}
.crest-light{position:absolute;top:8px;right:17px;font-size:11px;color:#ffebad;z-index:2}
.team-crest.small{width:30px;height:35px}
.team-crest.small .crest-letter{font-size:18px}
.team-crest.small .crest-light{display:none}
.header-team{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--team-accent) 8%,white);padding:5px 10px;border:1px solid color-mix(in srgb,var(--team-accent) 20%,white);border-radius:9px;color:var(--team-accent)}
.team-page{padding-top:32px;padding-bottom:80px}
.team-intro{text-align:center;max-width:780px;margin:0 auto 35px}

.team-choice::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--team-accent)}

.team-choice .team-info{display:flex;align-items:center;flex-direction:column;gap:3px;min-width:0}

.team-pick-arrow{font-weight:750;font-size:11px;color:var(--team-accent);margin-top:4px}
.team-disclaimer{text-align:center;font-size:12px;color:#8797a9;margin-top:25px}
.auth-layout{display:grid;grid-template-columns:1.05fr .9fr;gap:24px;align-items:stretch;max-width:1050px;margin:5vh auto}
.auth-showcase{border-radius:20px;background:linear-gradient(145deg,var(--team-alt) 0,var(--team-accent) 88%);color:white;min-height:490px;padding:50px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}

.auth-showcase p{font-size:17px;color:#fff;line-height:1.7}
.auth-showcase-desc{letter-spacing:.13em;font-size:10px;opacity:.75;margin-top:25px}
.auth-modern{margin:0;max-width:none;display:flex;flex-direction:column;justify-content:center;padding:clamp(25px,3vw,46px)}
.auth-modern h1{margin:12px 0 0;font-size:28px}
.auth-modern form{margin-top:20px}
.auth-modern form label{font-size:12px;font-weight:800;color:#46617b;display:block;margin:13px 0}
.auth-modern form input{width:100%;margin:6px 0 0}

const fmt=t=>new Date(t).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
el.innerHTML='<h2 class="sectiontitle">🏆 정규 리그 진행</h2><div class="panel"><h3>10구단 주간 리그 · '+esc(day)+'</h3><p>일요일~목요일 정규시즌 · 매시간 자동 경기 · 금요일 휴식 · 토요일 가을야구</p><div class="grid"><div class="metric">팀당 정규시즌<strong>144경기</strong></div><div class="metric">완료된 라운드<strong>'+Math.floor(lg.completedRounds||0)+'/144</strong></div><div class="metric">다음 경기<strong style="font-size:16px">'+(lg.nextTime?fmt(lg.nextTime):'정규시즌 종료')+'</strong></div><div class="metric">참가 구단<strong>'+(lg.memberCount||0)+'명 + AI '+(lg.botCount??9)+'</strong></div></div><p class="muted">120개 시간대에 144라운드를 편성하므로 일부 시간에는 두 라운드가 동시에 결과 처리됩니다. 모든 팀은 동일한 경기 수를 치릅니다.</p><button id="refreshLeague">↻ 리그 결과 갱신</button></div><div class="panel"><h3>📊 리그 순위표</h3><div class="scoreboard"><table><thead><tr><th>순위</th><th>구단</th><th>경기</th><th>승</th><th>패</th><th>무</th><th>승률</th><th>득실</th></tr></thead><tbody>'+lg.standings.map((x,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+esc(x.name)+'</b></td><td>'+x.played+'</td><td>'+x.wins+'</td><td>'+x.losses+'</td><td>'+x.draws+'</td><td>'+((x.wins+x.draws*.5)/Math.max(1,x.played)).toFixed(3)+'</td><td>'+(x.scored-x.allowed)+'</td></tr>').join('')+'</tbody></table></div></div><div class="two"><div class="panel"><h3>📅 내 구단 다음 경기</h3>'+(lg.upcoming.length?lg.upcoming.map(g=>'<div class="item"><div><b>'+esc(g.homeName)+' vs '+esc(g.awayName)+'</b><div class="muted">'+fmt(g.time)+' · '+g.round+'라운드</div></div></div>').join(''):'<p class="muted">남은 경기가 없습니다.</p>')+'</div><div class="panel"><h3>📋 최근 경기 결과</h3>'+(lg.recent.length?lg.recent.map(g=>'<div class="item"><div><b>'+esc(g.homeName)+' vs '+esc(g.awayName)+'</b><div class="muted">'+fmt(g.time)+'</div></div><b>'+esc(g.score)+'</b></div>').join(''):'<p class="muted">아직 경기가 없습니다.</p>')+'</div></div><div class="panel"><h3>🏅 토요일 가을야구</h3><p class="muted">정규시즌 상위 4개 구단 진출</p>'+(lg.postseason.length?lg.postseason.map(p=>'<div class="item"><b>'+esc(p.label)+'</b><span>'+esc(p.home)+' vs '+esc(p.away)+(p.score?' · '+esc(p.score):' · '+fmt(p.time))+'</span></div>').join(''):'<p>토요일 경기 일정이 공개됩니다.</p>')+'</div>';
document.getElementById('refreshLeague').onclick=async()=>{state=await(await fetch('/api/state')).json();content()};return}}

function bindDetail(){document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>{const p=state.club.players.find(x=>x.id===b.dataset.player);const d=document.getElementById('playerDetail');d.innerHTML='<div class="panel"><h3>'+esc(playerLabel(p))+' '+g(p)+'</h3><p class="muted">'+esc(p.pos)+' / 종합 '+overall(p)+'</p><div class="toolbar"><button id="upSelected" '+(p.grade==='A'?'disabled':'')+'>등급 성장 (1 CP)</button>'+Object.keys(fieldNames).map(k=>'<button data-train="'+k+'">'+fieldNames[k]+' 훈련 (100만원)</button>').join('')+'</div></div>';document.getElementById('upSelected').onclick=()=>api({type:'upgrade',id:p.id});document.querySelectorAll('[data-train]').forEach(x=>x.onclick=()=>api({type:'train',id:p.id,key:x.dataset.train}));d.scrollIntoView({behavior:'smooth',block:'nearest'})})}

function findPlayerProfile(id){const club=state.club;return (club?.players||[]).find(p=>p.id===id)||(state.listings||[]).map(l=>l.player).find(p=>p.id===id)||(club?.scoutHistory||[]).map(h=>h.player).find(p=>p.id===id)||null}
function openPlayerProfile(p){
 if(!p)return;
 document.getElementById('playerProfileOverlay')?.remove();
 const t=(state.teams||[]).find(x=>x.id===p.originTeam)||(state.teams||[]).find(x=>x.id===state.club?.teamId);
 const overlay=document.createElement('div');overlay.id='playerProfileOverlay';overlay.className='player-profile-overlay';
 overlay.innerHTML='<div class="player-profile-card" role="dialog" aria-modal="true" aria-label="선수 상세 정보"><div class="player-profile-top"><span>PLAYER INFORMATION</span><button type="button" class="close-profile" aria-label="닫기">✕</button></div><div class="player-profile-overview"><div class="player-profile-avatar">⚾</div><div><div class="player-profile-role">'+esc(p.pos)+' · '+shortYear(p)+' 시즌</div><h2>'+esc(playerLabel(p))+'</h2><div class="player-profile-meta">'+g(p)+' <span>종합 '+statCell(overall(p))+'</span><span>'+(t?esc(t.name):'가상 선수')+'</span></div></div></div><div class="player-profile-stats"><h3>선수 능력치</h3>'+Object.keys(fieldNames).map(k=>{const val=Number(p[k]??(k==='mental'?p.stamina:55))||0;return '<div class="player-profile-stat"><span>'+fieldNames[k]+'</span><div class="player-profile-bar stat-bg-'+statColor(val)+'"><div style="width:'+Math.min(100,val)+'%"></div></div><strong>'+statCell(val)+'</strong></div>'}).join('')+'</div><div class="player-profile-bottom"><span>연도 '+shortYear(p)+' · 나이 '+getAge(p)+'세 · '+esc(p.pos)+'</span><button type="button" class="close-profile">닫기</button></div></div>';
 document.body.appendChild(overlay);const close=()=>overlay.remove();overlay.addEventListener('click',e=>{if(e.target===overlay)close()});overlay.querySelectorAll('.close-profile').forEach(b=>b.onclick=close);overlay.querySelector('.close-profile').focus();
}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-profile]');if(btn){e.preventDefault();e.stopPropagation();openPlayerProfile(findPlayerProfile(btn.dataset.profile))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('playerProfileOverlay')?.remove()});

function render(){theme();if(!state.user)return selectedTeam?login():selectTeam();if(!state.club)return create();root()}start();
</script></body></html>
