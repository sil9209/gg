/* Classic baseball management theme, custom original artwork */
:root{--bg:#07111d;--surface:#10243b;--light:#1d3959;--line:#375578;--muted:#b5c9da}

.layout{display:block}.nav{display:flex;flex-direction:row;gap:0;padding:0;margin-bottom:19px;overflow:auto;background:linear-gradient(#183a64,#0a1d33);border:1px solid #47658b;border-radius:11px;box-shadow:0 8px 22px #0006}

.club-home{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:17px}
.club-home .stadium{height:355px;min-height:0;border:2px solid #587ca4;position:relative;overflow:hidden;display:block;text-align:left;padding:0;background:radial-gradient(ellipse 110% 56% at 50% 85%,#245335 0 33%,#133f30 54%,transparent 55%),linear-gradient(180deg,#1d335d 0,#425d80 38%,#101e31 39%,#152842 48%,#122638 100%);box-shadow:inset 0 3px 30px #0008}
.stadium::before{content:"";position:absolute;bottom:-75px;left:50%;width:330px;height:330px;transform:translateX(-50%) rotate(45deg) scaleY(.72);background:linear-gradient(135deg,#b89b72 0 10%,#2e6e46 10% 75%,#b89b72 75% 100%);border:8px solid #ccbb93;box-shadow:0 0 25px #0008}
.stadium::after{content:"";position:absolute;left:7%;right:7%;top:42%;height:9px;background:repeating-linear-gradient(90deg,#f5ffff 0 3px,#bed9e6 3px 5px,transparent 5px 10px);filter:drop-shadow(0 0 8px white)}

.classic-shortcuts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:17px}

.classic-shortcuts span{font-size:30px}

.scoreboard table{width:100%}.scoreboard th{background:#153454}.scoreboard td,.scoreboard th{padding:11px 13px}

/* Franchise identity, original emblems, and pre-login team selector */
:root{--team-accent:#286bbb;--team-alt:#164d8a}
body{font-family:Inter,Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif}
button.primary,.primary,.nav button.active{background:var(--team-accent);border-color:var(--team-accent);color:white}

.nav button.active{box-shadow:0 4px 12px color-mix(in srgb,var(--team-accent) 30%,transparent)}

.lineup-field-column{background:#fff;border:1px solid #dce5ef;border-radius:17px;overflow:hidden;box-shadow:0 5px 19px #203e5a10;min-width:0}
.lineup-field-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 18px;background:#f7faff;color:#264660}.lineup-field-head span{font-size:11px;color:#8293a7}
.lineup-field{aspect-ratio:1.22;min-height:455px;position:relative;overflow:hidden;background:linear-gradient(180deg,#7ab2d3 0,#b4d8e7 18%,#2e6d48 19%,#317a4b 35%,#398c51 100%);isolation:isolate}
.lineup-crowd{position:absolute;top:16%;left:-7%;width:114%;height:18%;border-radius:0 0 55% 55%;background:repeating-linear-gradient(100deg,#20384c 0 7px,#647d81 7px 10px,#2c5275 10px 13px,#a4b2a4 13px 15px);opacity:.8;box-shadow:0 6px 0 #cbd9dc;transform:perspective(800px) rotateX(23deg)}
.lineup-turf{position:absolute;inset:27% -15% -12%;border-radius:50% 50% 0 0;background:repeating-linear-gradient(105deg,#338346 0 55px,#3a9553 55px 110px);box-shadow:inset 0 28px 35px #0002;transform:perspective(730px) rotateX(13deg)}
.lineup-infield{position:absolute;left:50%;top:65%;width:55%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg) scaleY(.73);background:#bd9a67;border:7px solid #f5e4c1;box-shadow:0 0 22px #0003,inset 0 0 30px #9f774a}
.lineup-diamond-shape{position:absolute;inset:17%;border:4px solid #eef7e2;background:#348b52;box-shadow:0 0 0 8px #c7ab7b}
.lineup-pitch-mound{position:absolute;left:50%;top:69%;width:10%;height:5%;border-radius:50%;background:#c6a271;transform:translate(-50%,-50%);box-shadow:0 0 0 5px #ead1a6}
.lineup-foul{position:absolute;height:2px;width:70%;background:#f1f8ea;transform-origin:left center;left:50%;top:92%;z-index:1;opacity:.9}.foul-left{transform:rotate(-148deg)}.foul-right{transform:rotate(-32deg)}
.diamond-position{position:absolute;z-index:3;transform:translate(-50%,-50%);min-height:0;width:clamp(72px,9vw,113px);padding:5px;border-radius:10px;background:linear-gradient(150deg,#112f4de8,#0d2237ee);color:#fff;border:1px solid #d8edffb0;box-shadow:0 4px 12px #0008;display:flex;flex-direction:column;gap:1px;align-items:stretch;text-align:center}
.diamond-position:hover{background:#1b547c;color:#fff;transform:translate(-50%,-52%)}.diamond-pos-label{font-size:10px;font-weight:900;color:#f4d17d;align-self:flex-start}.diamond-player-name{font-size:clamp(9px,1vw,12px);font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.diamond-player-grade{font-size:10px;color:#d6e8f7}.pitcher-pin{background:linear-gradient(130deg,#563323ed,#1f2c40ef)}
.lineup-field-summary{display:flex;justify-content:space-around;gap:11px;flex-wrap:wrap;padding:16px;background:#f5f9fe;color:#5f778d;font-size:12px}.lineup-field-summary strong{color:var(--team-accent)}.lineup-help{padding:0 14px;font-size:10px;color:#91a1ae}
.lineup-editor{display:flex;flex-direction:column;gap:13px;min-width:0}.lineup-editor-panel{background:#fff;border:1px solid #dce5ef;border-radius:14px;overflow:hidden;box-shadow:0 5px 15px #203e5a0b}
.lineup-editor-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;background:#ecf4fd;border-bottom:1px solid #dce8f2}.lineup-editor-head h3{margin:0;color:#2b4c6b;font-size:15px}.lineup-editor-head span{font-size:11px;color:#8596a8}
.lineup-edit-list{padding:8px 13px}.lineup-edit-row{display:flex;align-items:center;gap:9px;padding:5px 0}.lineup-edit-row select{min-width:0;flex:1;width:100%;font-size:12px;min-height:37px;padding:6px 8px}
.lineup-order,.lineup-pos-tag,.lineup-pitch-label{flex:none;width:34px;border-radius:7px;background:#e8f1fb;color:#36689f;display:grid;place-items:center;font-weight:850;font-size:12px;min-height:29px}
.lineup-pitch-label{width:70px;font-size:11px}
.lineup-bench-list{max-height:330px;overflow:auto;padding:9px 14px}.lineup-bench-row{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:9px 0;border-bottom:1px solid #edf1f5}.lineup-bench-row:last-child{border:0}.lineup-bench-row>div{display:flex;flex-direction:column;gap:3px;min-width:0}.lineup-bench-row b{font-size:12px}.lineup-bench-row small{font-size:10px}.lineup-bench-row select{width:104px;min-height:35px;font-size:11px;flex:none}
.lineup-reserves{padding:12px 16px;border-top:1px solid #edf1f5}.lineup-reserves strong{font-size:11px}.lineup-reserves>div{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.lineup-reserves span{padding:4px 7px;background:#eff5fc;border-radius:6px;font-size:10px}
.lineup-editor-actions{display:flex;gap:8px}.lineup-editor-actions button{flex:1;min-width:0}
@media(max-width:1050px){.lineup-workspace{grid-template-columns:1fr}.lineup-editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.lineup-editor-actions{grid-column:1/-1}.lineup-field{max-height:650px}}
@media(max-width:650px){.lineup-page-title{align-items:flex-start;flex-wrap:wrap}.lineup-workspace{gap:12px}.lineup-editor{grid-template-columns:1fr}.lineup-editor-actions{grid-column:auto}.lineup-field{min-height:340px;aspect-ratio:1.05}.diamond-position{width:78px}.diamond-player-name{font-size:9px}.lineup-field-head{align-items:flex-start;flex-direction:column;padding:12px 14px;gap:2px}.lineup-field-summary{padding:10px}}
.player-growth-info{padding:15px 27px;background:#f2f7fd;border-top:1px solid #e3ebf3;color:#4b6a86;font-size:12px;line-height:1.9}.player-growth-info strong{color:var(--team-accent)}.player-growth-info small{color:#8495a7}@media(max-width:520px){.player-growth-info{padding:13px 18px}}
.player-portrait{width:38px;height:40px;display:inline-flex;flex:none;overflow:hidden;border-radius:7px;background:#e1edf8;vertical-align:middle}.player-portrait img{height:100%;width:100%;object-fit:cover}.player-portrait.large{width:107px;height:116px;border-radius:11px}.player-portrait.field{width:32px;height:34px;margin:auto}.roster-portrait{display:inline-flex;align-items:center;gap:7px}
.condition-label{font-size:11px;font-weight:850}.cl-1,.cl-2{color:#2877d0}.cl-3{color:#8b929f}.cl-4,.cl-5{color:#d64046}
.friendly-title{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.friendly-title h2{margin:0}.friendly-counter{background:#f2f7fd;border:1px solid #dbe8f3;padding:15px;border-radius:11px;white-space:nowrap;font-size:12px}.friendly-counter strong{display:block;color:var(--team-accent);font-size:24px;text-align:center}
.friendly-form label{display:flex;gap:10px;align-items:center;margin:16px 0}.friendly-form label select{flex:1;min-width:0}.friendly-rewards{display:flex;gap:12px;flex-wrap:wrap}.friendly-rewards label{padding:12px 16px;border:1px solid #dae6f2;background:#f6fafe;border-radius:10px}.friendly-form #friendlyPlay{width:100%;margin:15px 0 6px}
.condition-roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.condition-player{display:flex;align-items:center;gap:8px;border:1px solid #e2eaf4;padding:9px;border-radius:9px;min-width:0}.condition-player>div{flex:1;min-width:0}.condition-player b,.condition-player small{display:block;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.condition-player small{margin-top:5px;color:#8293a6}.condition-player button{font-size:11px;padding:7px 9px}
.friendly-result-overlay{position:fixed;inset:0;z-index:500;background:#122a45ba;display:flex;align-items:center;justify-content:center;padding:15px}.friendly-result-card{background:white;border-radius:16px;padding:24px;width:min(100%,540px);max-height:90vh;overflow-y:auto;text-align:center}.friendly-final-score{font-size:40px;font-weight:1000;color:#244c71}.friendly-result-card>p{color:#8091a2;font-size:13px}.friendly-result-card>strong{color:#278650}.friendly-stat-list{max-height:280px;overflow:auto;text-align:left}.friendly-stat-list>div{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto;align-items:center;padding:10px 0;border-top:1px solid #e7edf3;font-size:12px;gap:8px;text-align:left}.friendly-stat-list>div>small{text-align:left;min-width:0}.friendly-stat-list>div>b{text-align:right;min-width:30px}.friendly-stat-list small{color:#8495a8}.friendly-stat-list .raise{color:#cf4349}.friendly-stat-list .drop{color:#2877cc}.friendly-result-card>button{width:100%;margin-top:18px}
@media(max-width:600px){.condition-roster{grid-template-columns:1fr}.friendly-form label{flex-wrap:wrap}}

.scout-portrait-wrap{display:flex;align-items:center;justify-content:center;padding:8px 0 12px}.scout-portrait-wrap .player-portrait.large{width:118px;height:131px;border:3px solid #e2eefa;border-radius:16px;box-shadow:0 6px 22px #183d5a21}
.diamond-position .player-portrait.field{width:33px;height:36px;margin:2px auto}
.market-portrait{display:inline-flex;gap:8px;align-items:center}.player-portrait[data-avatar-ready="1"]{background:linear-gradient(145deg,#d3e5f7,#eaf1fa)}

.player-portrait{position:relative;overflow:hidden}.portrait-crest{position:absolute;top:2px;left:2px;z-index:3;display:flex;align-items:center;justify-content:center;width:19px;height:21px;border:1.5px solid white;border-radius:5px;background:var(--crest);color:white;font-size:10px;font-weight:950;box-shadow:0 1px 4px #1115;line-height:1}
/* Award-card variant markers: preserve team crest top-left and show G/M top-right. */
.player-portrait .portrait-award{position:absolute;right:2px;top:2px;z-index:5;display:grid;place-items:center;width:19px;height:21px;border:1.5px solid #fff;border-radius:5px;font-size:12px;font-weight:950;line-height:1;box-shadow:0 1px 4px #1115}
.player-portrait .portrait-award-G{color:#795317;background:linear-gradient(140deg,#fff2b2,#e1b84c)}
.player-portrait .portrait-award-M{color:#fff;background:linear-gradient(140deg,#ae6be8,#6533a4)}
.player-portrait.large .portrait-award{width:29px;height:31px;top:5px;right:5px;font-size:18px;border-radius:8px}
.player-portrait.field .portrait-award{width:13px;height:14px;top:1px;right:1px;font-size:8px;border-radius:3px;border-width:1px}
.player-portrait.large .portrait-crest{width:29px;height:31px;top:5px;left:5px;font-size:15px;border-radius:8px}.player-portrait.field .portrait-crest{width:13px;height:14px;top:1px;left:1px;font-size:7px;border-radius:3px}
.player-caption{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}.player-caption small{font-size:10px;color:#8996a7;font-weight:600;white-space:nowrap;line-height:1.2}
.scout-popup-dialog #scoutRelease{color:#496276;background:#f0f4f8;border:1px solid #ccd8e5}
.diamond-team-name{font-size:8px;color:#c7d9e9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile-team-name{display:block;color:#8296ad;font-size:12px;margin:-6px 0 9px}
.scout-payment-picker{margin:0 0 25px;padding:20px 23px;background:#fff;border:1px solid #dce6f1;border-radius:15px;box-shadow:0 4px 15px #163b5b10}
.scout-payment-heading{display:flex;justify-content:space-between;align-items:center;gap:10px}.scout-payment-heading h3{margin:0;font-size:17px}.scout-payment-heading span{font-size:11px;color:#8a9bac}
.scout-currency-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:17px}
.scout-currency-tabs button{padding:17px;border-radius:12px;border:1px solid #d8e5f2;background:#f6f9fd;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:#5f7890;transition:background .16s,border-color .16s,transform .16s}
.scout-currency-tabs button:hover{transform:translateY(-2px)}.scout-currency-tabs button.active{border:2px solid var(--team-accent);background:#ecf5ff;color:#1e5e9b;box-shadow:0 3px 12px #1b5b9920}
.scout-currency-tabs button span{font-weight:850;font-size:15px}.scout-currency-tabs button strong{font-size:12px}
.scout-probability{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:17px}
.scout-prob-label{font-size:12px;color:#698197;font-weight:800;margin-right:6px}
.scout-prob-pill{display:inline-flex;gap:10px;align-items:center;border-radius:9px;background:#eff5fc;color:#37688f;padding:8px 12px;font-size:12px;font-weight:750}
.scout-prob-pill strong{color:#1b4e7b;font-size:13px}
.scout-prob-pill.scout-level-9,.scout-prob-pill.scout-level-10{background:#fff0e7;color:#b15a30}
.scout-four-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.scout-four-grid .scout-contract-header{height:85px}.scout-four-grid .scout-contract-body{padding:16px}.scout-four-grid .scout-contract-bottom{gap:7px;flex-wrap:wrap}
.scout-four-grid .scout-contract-bottom button{white-space:nowrap}
.scout-pending-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px;border:1px solid #e6cd87;background:#fff8e8;border-radius:12px;padding:15px;color:#8e6028}
.scout-pending-bar button{background:#aa722d;color:white}
@media(max-width:1050px){.scout-four-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:580px){.scout-four-grid{grid-template-columns:1fr}.scout-payment-heading{display:block}.scout-currency-tabs{grid-template-columns:1fr}}

/* Cute 3D baseball portrait v3: sharper eyes, friendly pastel portrait cards. */
.player-portrait{background:linear-gradient(145deg,#eaf4fc,#c5dbed);box-shadow:inset 0 0 0 1px #ffffffb8,0 2px 7px #1d466022;isolation:isolate;border:1px solid #d5e6f4}
.player-portrait img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center}
.player-portrait.large{border-radius:15px;box-shadow:0 9px 25px #1a4b7130,inset 0 0 0 2px white}
.player-portrait.field{border-radius:7px}
.player-portrait .portrait-crest{z-index:3}
.admin-mode-tag{border:1px solid #f3d58e;background:#fff4d8;color:#79521d;font-size:11px;font-weight:900;padding:8px 11px;border-radius:9px;white-space:nowrap}.stats .pill{white-space:nowrap}
/* Prevent accidental page-selection/asset-dragging. Keep form controls and lineup sorting usable. */
html,body,#app,#app *{-webkit-user-select:none;user-select:none}
input,textarea,select,[contenteditable="true"],[contenteditable="true"] *{-webkit-user-select:text!important;user-select:text!important}
img,a{-webkit-user-drag:none}
.lineup-drag-item{-webkit-user-drag:element;cursor:grab}

/* DIAMOND GM — Lineup Studio 2.0 (independent responsive design system) */
.gm-lineup-shell{--gm-deep:#1e3854;--gm-sub:#667e94;--gm-blue:#2570c2;--gm-border:#dfe8f0;--gm-bg:#f4f8fc;color:var(--gm-deep);width:100%;max-width:1460px;margin:0 auto;padding-bottom:28px;min-width:0}
.gm-lineup-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 0 19px;padding:9px 0 2px}
.gm-eyebrow{font-size:10px;letter-spacing:.16em;font-weight:900;color:#2c6ead;text-transform:uppercase}
.gm-lineup-heading h2{font-size:clamp(23px,2.5vw,30px);font-weight:950;letter-spacing:-.04em;line-height:1.2;margin:5px 0 8px;color:#203d5b}
.gm-lineup-heading p{font-size:12px;color:#8295a9;margin:0}
.gm-lineup-team{display:flex;gap:9px;align-items:center;border:1px solid var(--gm-border);padding:10px 15px;background:#fff;border-radius:13px;white-space:nowrap;box-shadow:0 3px 9px #133c620a}
.gm-lineup-team b,.gm-lineup-team small{display:block}.gm-lineup-team b{font-size:12px;color:#274d70}.gm-lineup-team small{font-size:10px;color:#94a4b4;margin-top:4px}
.gm-team-mark{border-radius:10px;width:38px;height:38px;display:grid;place-items:center;background:#e8f2fd;color:var(--team-accent,#2b6fb8);font-weight:950;font-size:17px}
.gm-lineup-tabs{display:flex;gap:7px;margin-bottom:16px;padding:5px;border:1px solid #dce6f0;border-radius:15px;background:#eaf1f8;width:max-content;max-width:100%}
.gm-lineup-tabs button{border:0;background:transparent;border-radius:10px;display:flex;align-items:center;gap:12px;padding:11px 18px;font-weight:900;color:#627d96;font-size:13px;min-width:0;transition:background .18s,box-shadow .18s,color .18s}
.gm-lineup-tabs button span{font-size:10px;font-weight:650;color:#879bae}
.gm-lineup-tabs button.active{background:#fff;color:#246aab;box-shadow:0 2px 8px #153f6225}
.gm-lineup-tabs button.active span{color:#62849f}
.gm-lineup-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:17px}
.gm-lineup-metrics>div{background:#fff;border:1px solid var(--gm-border);border-radius:13px;padding:13px 16px;box-shadow:0 4px 11px #174b6d08;min-width:0}
.gm-lineup-metrics small{display:block;color:#8298ab;font-size:11px;margin-bottom:8px}
.gm-lineup-metrics strong{font-size:22px;color:#204b72;letter-spacing:-.05em;line-height:1.05;font-variant-numeric:tabular-nums}
.gm-lineup-metrics strong span{font-size:12px;color:#9baaba;font-weight:650}
.gm-lineup-columns{display:grid;grid-template-columns:minmax(0,1.03fr) minmax(0,1fr);gap:15px;align-items:start}
.gm-lineup-right{display:flex;flex-direction:column;gap:15px;min-width:0}
.gm-panel{min-width:0;background:#fff;border:1px solid var(--gm-border);border-radius:17px;overflow:hidden;box-shadow:0 5px 18px #1b486b0e}
.gm-panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:72px;padding:15px 17px;border-bottom:1px solid #e6edf4;background:linear-gradient(180deg,#fff,#fcfdff)}
.gm-panel-kicker{display:block;font-size:9px;letter-spacing:.16em;font-weight:950;color:#7a9ab5;margin-bottom:5px}
.gm-panel-head h3{font-size:16px;color:#254968;font-weight:900;letter-spacing:-.04em;margin:0;line-height:1.2}
.gm-panel-head h3 small{font-size:11px;color:#86a1b6;font-weight:650;margin-left:5px}
.gm-panel-hint{font-size:10px;color:#7f99ad;white-space:nowrap;text-align:right}
.gm-batting-list{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.gm-order-row{min-width:0;display:flex;align-items:center;gap:9px;border:1px solid #e5ecf3;border-radius:11px;min-height:60px;padding:6px 9px;background:#fff;box-shadow:0 1px 2px #173e5b04;transition:transform .16s,border .15s,box-shadow .15s,background .15s;cursor:grab;touch-action:pan-y}
.gm-order-row:hover{border-color:#abc9e5;background:#fbfdff;box-shadow:0 4px 13px #204c7413}
.gm-order-row.is-dragging{cursor:grabbing;opacity:.88;background:#eef6ff;border-color:#3f8ccf;position:relative;z-index:12;box-shadow:0 12px 23px #17477742}
.gm-order-row.is-drop-target{background:#e9f4ff;border:2px dashed #3284cd;box-shadow:0 0 0 3px #c0dff779}
.gm-order-row.gm-order-arrived{animation:gmOrderArrive .4s cubic-bezier(.2,.8,.3,1)}
@keyframes gmOrderArrive{0%{transform:translateY(-9px);background:#e2f2ff}100%{transform:translateY(0);background:#fff}}
.gm-order-rank{width:32px;height:38px;border-radius:9px;background:#eff4fb;color:#3a6f9e;display:grid;place-items:center;font-size:19px;font-weight:950;font-variant-numeric:tabular-nums;flex:none}
.gm-grab{font-size:22px;line-height:1;color:#a5b7c8;cursor:grab;touch-action:none;flex:none;padding:5px 0}
.gm-order-row .player-portrait{width:38px;height:43px;flex:none;border-radius:9px}
.gm-empty-face{width:38px;height:43px;background:#edf3f8;border-radius:9px;display:grid;place-items:center;color:#a0b3c6}
.gm-batter-identity{min-width:0;flex:1}.gm-batter-identity b{font-size:12px;color:#263f58;font-weight:900;display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.gm-batter-identity small{display:block;margin-top:4px;color:#9aaab8;font-size:10px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.gm-hitter-pos{width:30px;text-align:center;color:#66859e;border:1px solid #deebf5;border-radius:6px;font-size:10px;font-weight:900;padding:5px 1px;background:#f7faff;flex:none}
.gm-order-ovr{font-size:13px;color:#2a6fa9;font-weight:950;font-variant-numeric:tabular-nums;text-align:right;width:42px;flex:none}
.gm-order-condition{font-size:10px;min-width:48px;text-align:center;flex:none}
.gm-order-condition .condition-label{font-size:10px}
.gm-order-controls{display:flex;gap:2px;flex:none}
.gm-order-controls button{font-size:11px;display:grid;place-items:center;width:27px;min-width:27px;height:29px;min-height:0;padding:0;border:1px solid #d8e6f1;border-radius:7px;background:#f7fafd;color:#537c9e}
.gm-order-controls button:disabled{opacity:.3}
.gm-panel-foot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #e7edf4;padding:14px 16px;background:#f8fbfe;color:#8599ac;font-size:11px}
.gm-panel-foot b{color:#2c6697;font-size:12px}
.gm-field{height:395px;position:relative;overflow:hidden;background:repeating-linear-gradient(108deg,#2f845b 0 64px,#328c5d 64px 128px);isolation:isolate}
.gm-field:before{content:"";position:absolute;left:-7%;top:-36%;width:114%;height:73%;background:#235f49;border-radius:0 0 48% 48%;box-shadow:0 5px 24px #133c352e;opacity:.35}
.gm-field-grass{position:absolute;inset:8% -10% -30%;border-radius:52% 52% 0 0;border:2px solid #c9e5c365;background:repeating-linear-gradient(108deg,#348e61 0 62px,#3a9565 62px 124px);box-shadow:inset 0 17px 35px #15432b24}
.gm-field-dirt{position:absolute;left:50%;top:62%;width:47%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg) scaleY(.72);border:5px solid #f6ebca;background:#c9a173;box-shadow:0 10px 35px #1a3a2a30,inset 0 0 15px #9c7446}
.gm-field-inner{position:absolute;left:50%;top:62%;width:28%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg) scaleY(.72);background:#318657;border:2px solid #fff0c7}
.gm-field-base{position:absolute;width:11px;height:11px;background:#fff4d8;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 1px 4px #18412b87;z-index:1}
.gm-field-base.base-home{left:50%;top:87%}.gm-field-base.base-two{left:50%;top:37%}.gm-field-base.base-one{left:75%;top:62%}.gm-field-base.base-three{left:25%;top:62%}
.gm-field-node{position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;border-radius:9px;background:#fffefb;box-shadow:0 5px 14px #12382b56;border:1px solid #e4eee0;min-width:0;width:82px;min-height:48px;padding:5px 5px 6px;color:#243e56;transition:transform .17s,box-shadow .17s,background .17s;cursor:pointer}
.gm-field-node:hover,.gm-field-node:focus-visible{background:#f0f8ff;transform:translate(-50%,-56%);box-shadow:0 8px 19px #092c3157;outline:2px solid #4892d0}
.gm-node-role{position:absolute;left:-6px;top:-8px;min-width:25px;background:#244f73;border:1px solid #dcebf4;color:#fff;border-radius:5px;padding:3px 4px;font-size:9px;font-weight:950;box-shadow:0 2px 5px #1024353b}
.gm-node-name{font-size:11px;font-weight:900;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm-node-rating{font-size:10px;color:#3b80b8;font-weight:850;white-space:nowrap}
.gm-field-pitcher{background:#fff3df;border-color:#f6dcb4}
.gm-field-pitcher .gm-node-role{background:#ad7435}
.gm-field-legend{padding:13px 15px;background:#f9fbfd;font-size:10px;color:#758da2;border-top:1px solid #e5edf4}
.gm-legend-dot{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:#43a67c}

 for(const [pos] of LINEUP_POSITIONS){const id=current[pos];if(id&&batting.includes(id)&&!used.has(id)){defense[pos]=id;used.add(id)}}

function bindGameDockDrag(){
 const dock=document.getElementById('gmNavDock'),handle=document.getElementById('gmNavToggle'),panel=document.getElementById('gmNavPanel');
 if(!dock||!handle||!panel)return;
 // Anchor the button itself (not the expanded panel) inside the visible viewport.
 // The panel is absolutely positioned so opening it never changes the drag bounds.
 if(gmDockViewportCleanup)gmDockViewportCleanup();
 const key='diamond-gm-dock-top-v1',margin=12;
 const viewport=()=>{
  const vv=window.visualViewport;
  return {top:Math.max(0,vv?.offsetTop||0),bottom:Math.min(window.innerHeight,(vv?.offsetTop||0)+(vv?.height||window.innerHeight))};
 };
 const safeBounds=()=>{
  const v=viewport(),height=handle.getBoundingClientRect().height||56;
  return {min:v.top+margin,max:Math.max(v.top+margin,v.bottom-height-margin)};
 };
 const clamp=y=>{const b=safeBounds();return Math.max(b.min,Math.min(Number.isFinite(y)?y:b.max,b.max))};
 const save=y=>{try{localStorage.setItem(key,String(Math.round(y)))}catch(e){}};
 const updatePanel=()=>{
  if(panel.hidden)return;
  const box=handle.getBoundingClientRect(),v=viewport(),spaceAbove=Math.max(0,box.top-v.top-margin-10),spaceBelow=Math.max(0,v.bottom-box.bottom-margin-10);
  const ideal=Math.min(600,Math.max(160,panel.scrollHeight||400));
  const below=spaceBelow>spaceAbove&&spaceAbove<ideal;
  panel.style.top=below?'calc(100% + 10px)':'auto';
  panel.style.bottom=below?'auto':'calc(100% + 10px)';
  panel.style.maxHeight=Math.max(0,Math.floor(below?spaceBelow:spaceAbove))+'px';
 };
 dock._gmRefreshPanel=updatePanel;
 let saved=NaN;
 try{saved=Number(localStorage.getItem(key))}catch(e){}
 const initial=Number.isFinite(saved)&&saved>0?saved:safeBounds().max;
 dock.style.top=clamp(initial)+'px';
 updatePanel();
 let startY=0,startTop=0,dragging=false,active=false,suppressClick=false;
 handle.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  active=true;dragging=false;

  handle.setPointerCapture(e.pointerId);
 });
 handle.addEventListener('pointermove',e=>{
  if(!active)return;
  const dy=e.clientY-startY;
  if(Math.abs(dy)>5)dragging=true;

 });
 const finish=()=>{
  if(!active)return;
  active=false;
  if(dragging){suppressClick=true;save(clamp(handle.getBoundingClientRect().top))}
  dragging=false;dock.classList.remove('is-dragging');updatePanel();
 };
 handle.addEventListener('pointerup',finish);
 handle.addEventListener('pointercancel',finish);
 handle.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();suppressClick=false}},true);
 const resize=()=>{
  if(!dock.isConnected)return;

function syncScoutCriteriaGroups(){
 document.querySelectorAll('[data-scout-criteria]').forEach(group=>{
  for(const key of ['ageEnabled','levelEnabled','specialEnabled']){
   const el=group.querySelector('[data-scout-rule="'+key+'"]');if(el)el.checked=scoutSelectionRules[key];
  }
  for(const key of ['minAge','minLevel']){
   const el=group.querySelector('[data-scout-rule="'+key+'"]');
   if(el){el.value=scoutSelectionRules[key];el.disabled=!scoutSelectionRules[key==='minAge'?'ageEnabled':'levelEnabled']}
  }
 });
}
function bindScoutCriteria(scope,afterChange){
 const group=scope.querySelector('[data-scout-criteria]');
 if(!group)return;
 group.addEventListener('change',()=>{
  const read=key=>group.querySelector('[data-scout-rule="'+key+'"]');
  scoutSelectionRules.ageEnabled=read('ageEnabled').checked;
  scoutSelectionRules.levelEnabled=read('levelEnabled').checked;
  scoutSelectionRules.specialEnabled=read('specialEnabled').checked;
  scoutSelectionRules.minAge=Math.max(17,Math.min(44,Math.floor(Number(read('minAge').value)||30)));
  scoutSelectionRules.minLevel=Math.max(1,Math.min(10,Math.floor(Number(read('minLevel').value)||8)));
  syncScoutCriteriaGroups();
  if(typeof afterChange==='function')afterChange();
 });
}

function confirmBatchScoutDecision({recruits,releases,reward}){
 return new Promise(resolve=>{
  document.getElementById('gmBatchConfirmOverlay')?.remove();
  const overlay=document.createElement('div');
  overlay.id='gmBatchConfirmOverlay';
  overlay.className='gm-batch-confirm-overlay';
  overlay.innerHTML='<section class="gm-batch-confirm" role="dialog" aria-modal="true" aria-labelledby="gmBatchConfirmTitle">'+
   '<div class="gm-batch-confirm-top"><h3 id="gmBatchConfirmTitle">영입·방출 확정</h3><button type="button" class="gm-batch-confirm-close" aria-label="닫기">✕</button></div>'+
   '<div class="gm-batch-confirm-summary">'+
    '<div class="gm-batch-confirm-item"><span>선택 영입</span><strong>'+recruits+'명</strong></div>'+
    '<div class="gm-batch-confirm-item"><span>자동 방출</span><strong>'+releases+'명</strong></div>'+
    '<div class="gm-batch-confirm-item reward"><span>방출 보상</span><strong>'+money(reward)+'</strong></div>'+
   '</div>'+
   '<p class="gm-batch-confirm-warning">⚠️ 방출한 선수는 복구할 수 없으며, 확정 후 변경할 수 없습니다.</p>'+
   '<div class="gm-batch-confirm-actions"><button type="button" class="gm-batch-confirm-cancel">취소</button><button type="button" class="gm-batch-confirm-accept">확정</button></div>'+
  '</section>';
  const previousFocus=document.activeElement;
  let finished=false;
  function close(confirmed){
   if(finished)return;
   finished=true;document.removeEventListener('keydown',onKeydown,true);
   overlay.remove();
   if(previousFocus?.isConnected)previousFocus.focus();
   resolve(confirmed);
  }
  function onKeydown(e){
   if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();close(false)}
   if(e.key==='Tab'){
    const buttons=[...overlay.querySelectorAll('button')];const first=buttons[0],last=buttons[buttons.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
   }
  }
  overlay.querySelector('.gm-batch-confirm-close').onclick=()=>close(false);
  overlay.querySelector('.gm-batch-confirm-cancel').onclick=()=>close(false);
  overlay.querySelector('.gm-batch-confirm-accept').onclick=()=>close(true);
  overlay.onclick=e=>{if(e.target===overlay)close(false)};
  document.body.appendChild(overlay);
  document.addEventListener('keydown',onKeydown,true);
  overlay.querySelector('.gm-batch-confirm-cancel').focus();
 });
}

function openLeagueTeamRoster(team){
 document.getElementById('gmLeagueRosterBackdrop')?.remove();
 // The viewer's own team uses the live club roster, avoiding stale league snapshot data.
 if(state.club&&team.id===state.club.id){
  const club=state.club;
  const bats=(club.players||[]).filter(p=>!p.isPitcher);
  const pitchers=(club.players||[]).filter(p=>p.isPitcher);
  const battingOrder=[...new Set((club.lineup||[]).filter(id=>bats.some(p=>p.id===id)))].slice(0,9);
  for(const p of bats)if(battingOrder.length<9&&!battingOrder.includes(p.id))battingOrder.push(p.id);
  const roles=[...Array.from({length:6},(_,i)=>'starter'+(i+1)),...Array.from({length:8},(_,i)=>'relief'+(i+1)),'closer','closer2'];
  const pitcherOrder=[...new Set([
   ...roles.map(k=>club.pitcherRotation?.[k]),club.pitcher,
   club.pitcherAssignments?.starter,club.pitcherAssignments?.relief,club.pitcherAssignments?.closer,
   ...pitchers.map(p=>p.id)
  ].filter(id=>pitchers.some(p=>p.id===id)))];
  const first=new Set([...battingOrder,...pitcherOrder,...(club.benchIds||[])]);
  team={...team,battingOrder,pitcherOrder,roster:club.players.map(p=>({...p,squad:first.has(p.id)?'1군':'2군'}))};
 }
 const players=Array.isArray(team.roster)?team.roster:[];
 const byId=new Map(players.map(p=>[p.id,p]));
 const choose=(ids,kind)=>{
  const chosen=[...new Set(Array.isArray(ids)?ids:[])].map(id=>byId.get(id)).filter(p=>p&&p.isPitcher===(kind==='pitcher'));
  const rest=players.filter(p=>p.isPitcher===(kind==='pitcher')&&p.squad==='1군'&&!chosen.some(x=>x.id===p.id));
  return [...chosen,...rest];
 };
 const pitchers=choose(team.pitcherOrder,'pitcher'),batters=choose(team.battingOrder,'batter').slice(0,9);
 const overlay=document.createElement('div');overlay.id='gmLeagueRosterBackdrop';overlay.className='gm-league-roster-backdrop';
 const card=(p,label)=>'<button type="button" class="gm-league-player-card" data-league-player="'+esc(p.id)+'" aria-label="'+esc(p.name)+' 선수 정보 보기"><span class="gm-league-order-tag">'+esc(label)+'</span>'+playerPortrait({...p,currentTeamId:team.teamId})+'<strong>'+esc(playerLabel(p))+'</strong><span>'+esc(p.pos)+'</span><small>Lv.'+(Number(p.level)||1)+' · 성장 '+esc(p.grade||'E')+' · 종합 '+overall(p)+'</small></button>';
 const row=(list,kind)=>'<section class="gm-league-line"><div class="gm-league-line-heading"><strong>'+(kind==='pitcher'?'⚾ 투수진':'🏏 타순')+'</strong><small>'+(kind==='pitcher'?'선발 → 중계 → 마무리':'1번 → 9번')+' · 좌우로 드래그</small></div><div class="gm-league-horizontal-track" data-league-drag-track>'+ (list.length?list.map((p,i)=>card(p,kind==='pitcher'?(p.pos==='마무리'?'마무리':p.pos==='중계'?'중계':'선발'):(i+1)+'번 타자')).join(''):'<p class="muted">출전 가능한 선수가 없습니다.</p>')+'</div></section>';
 overlay.innerHTML='<section class="gm-league-roster-dialog" role="dialog" aria-modal="true" aria-label="'+esc(team.name)+' 선수단"><header class="gm-league-roster-head"><div><small>LEAGUE TEAM ROSTER</small><h2>'+esc(team.name)+'</h2><p>'+esc(team.ownerName||'구단주')+' · '+(team.real?'유저 구단':'AI 구단')+'</p></div><button type="button" class="gm-league-roster-close" aria-label="닫기">✕</button></header>'+
 '<div class="gm-league-roster-averages"><div><span>팀 평균</span><strong>'+(Number(team.teamAverage)||0).toFixed(2)+'</strong></div><div><span>타자 평균</span><strong>'+(Number(team.batterAverage)||0).toFixed(2)+'</strong></div><div><span>투수 평균</span><strong>'+(Number(team.pitcherAverage)||0).toFixed(2)+'</strong></div></div>'+
 '<div class="gm-league-roster-body"><div class="gm-league-roster-subhead"><h3>출전 선수단</h3><span>선수를 누르면 상세 카드가 열립니다</span></div>'+row(pitchers,'pitcher')+row(batters,'batter')+'</div></section>';
 document.body.appendChild(overlay);
 const close=()=>overlay.remove();
 overlay.querySelector('.gm-league-roster-close').onclick=close;
 overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
 overlay.querySelectorAll('[data-league-drag-track]').forEach(track=>{
  let down=false,moved=false,x=0,left=0;
  track.addEventListener('pointerdown',e=>{
   if(e.pointerType==='touch'||e.button!==0)return;
   down=true;moved=false;x=e.clientX;left=track.scrollLeft;
   // Capturing the pointer on the track retargets the final click away from the player button.
   // Keep the original click target so a tap opens the player profile.
  });
  track.addEventListener('pointermove',e=>{
   if(!down)return;const dx=e.clientX-x;if(Math.abs(dx)>5)moved=true;
   if(moved){track.classList.add('dragging');track.scrollLeft=left-dx}
  });
  const finish=()=>{down=false;track.classList.remove('dragging');if(moved){track.dataset.justDragged='1';setTimeout(()=>delete track.dataset.justDragged,80)}};
  track.addEventListener('pointerup',finish);track.addEventListener('pointercancel',finish);
  track.addEventListener('dragstart',e=>e.preventDefault());
  track.addEventListener('click',e=>{
   if(track.dataset.justDragged){e.preventDefault();e.stopPropagation();delete track.dataset.justDragged}
  },true);
 });
 overlay.querySelectorAll('[data-league-player]').forEach(btn=>btn.onclick=()=>{
  const found=players.find(p=>p.id===btn.dataset.leaguePlayer);if(!found)return;
  openPlayerProfile({...found,currentTeamId:team.teamId,originTeam:team.teamId});
 });
 overlay.querySelector('.gm-league-roster-close').focus({preventScroll:true});
}

function weeklyPlayerStatsMarkup(p){
 const owned=(state.club?.players||[]).some(x=>String(x.id)===String(p.id));
 if(!owned)return '';
 const rows=p.isPitcher?state.league?.weeklyPlayerStats?.pitchers:state.league?.weeklyPlayerStats?.batters;
 const r=(rows||[]).find(x=>String(x.id)===String(p.id)&&x.teamId===state.club?.teamId);
 const start=Number(state.league?.start),date=x=>new Date(x).toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric'});
 const period=Number.isFinite(start)&&start>0?date(start)+' ~ '+date(start+6*86400000):'이번 주';
 const cell=(label,v)=>'<div class="gm-weekly-stat"><small>'+label+'</small><strong>'+esc(String(v))+'</strong></div>';
 let items='';
 if(r){

  else items=[cell('출전',r.games+'경기'),cell('타율',Number(r.avg||0).toFixed(3)),cell('타수 / 안타',(r.ab||0)+' / '+(r.h||0)),cell('홈런',r.hr||0),cell('타점',r.rbi||0),cell('득점',r.r||0),cell('출루율',Number(r.obp||0).toFixed(3)),cell('볼넷',r.bb||0),cell('삼진',r.so||0)].join('');
 }
 return '<section class="gm-weekly-profile"><div class="gm-weekly-profile-head"><h3>📊 금주 성적</h3><small>'+esc(period)+' · 정규시즌</small></div>'+(items?'<div class="gm-weekly-grid">'+items+'</div>':'<p class="gm-weekly-empty">이번 주 정규시즌 출전 기록이 없습니다.</p>')+'</section>';
}
