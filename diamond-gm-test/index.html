/* Classic baseball management theme, custom original artwork */
:root{--bg:#07111d;--surface:#10243b;--light:#1d3959;--line:#375578;--muted:#b5c9da}
body{background:radial-gradient(ellipse at 60% 0%,#244e83 0,#071523 58%,#06101b 100%);}
.top{background:linear-gradient(180deg,#18365d,#0b1c33);border-bottom:3px solid #3b67a0;box-shadow:0 5px 18px #0008}
.head{min-height:92px}.brand-logo{font-size:23px}.brand-logo .ball{width:48px;height:48px;font-size:25px}
.layout{display:block}.nav{display:flex;flex-direction:row;gap:0;padding:0;margin-bottom:19px;overflow:auto;background:linear-gradient(#183a64,#0a1d33);border:1px solid #47658b;border-radius:11px;box-shadow:0 8px 22px #0006}
.nav button{flex:1;text-align:center;min-width:112px;border:0;border-right:1px solid #385675;border-radius:0;background:transparent;font-size:15px;padding:16px 11px;white-space:nowrap}
.nav button.active{background:linear-gradient(#286fc3,#154785);box-shadow:inset 0 0 0 1px #659ee9;border-bottom:3px solid #a8d3ff}
.panel{background:linear-gradient(155deg,#182f4c,#0e2137 80%);border-color:#41628a;box-shadow:inset 0 1px #ffffff12,0 5px 15px #0005}
.sectiontitle{color:#eef7ff;border-bottom:2px solid #3d6595;padding-bottom:11px;font-size:23px}
.club-home{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:17px}
.club-home .stadium{height:355px;min-height:0;border:2px solid #587ca4;position:relative;overflow:hidden;display:block;text-align:left;padding:0;background:radial-gradient(ellipse 110% 56% at 50% 85%,#245335 0 33%,#133f30 54%,transparent 55%),linear-gradient(180deg,#1d335d 0,#425d80 38%,#101e31 39%,#152842 48%,#122638 100%);box-shadow:inset 0 3px 30px #0008}
.stadium::before{content:"";position:absolute;bottom:-75px;left:50%;width:330px;height:330px;transform:translateX(-50%) rotate(45deg) scaleY(.72);background:linear-gradient(135deg,#b89b72 0 10%,#2e6e46 10% 75%,#b89b72 75% 100%);border:8px solid #ccbb93;box-shadow:0 0 25px #0008}
.stadium::after{content:"";position:absolute;left:7%;right:7%;top:42%;height:9px;background:repeating-linear-gradient(90deg,#f5ffff 0 3px,#bed9e6 3px 5px,transparent 5px 10px);filter:drop-shadow(0 0 8px white)}
.stadium .stadium-overlay{position:absolute;z-index:2;inset:0;background:linear-gradient(90deg,#071526d9,transparent 85%);padding:25px}
.stadium .stadium-overlay h2{font-size:31px;margin:18px 0}
.stadium .stadium-overlay button{font-size:16px;background:linear-gradient(#3282ec,#174d9e);border:1px solid #8cb9ff;box-shadow:0 3px 10px #0008}
.home-right .panel{margin-bottom:12px}.home-right h3{margin:0 0 11px;color:#d0e6ff}.home-right .item{padding:9px 2px}
.classic-shortcuts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:17px}
.classic-shortcuts button{min-height:108px;background:linear-gradient(155deg,#244975,#112a48);border:1px solid #5277aa;border-radius:9px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 1px #ffffff26}
.classic-shortcuts span{font-size:30px}
.scoreboard{font-variant-numeric:tabular-nums;border:1px solid #456e98;background:#091b30;border-radius:10px;overflow:auto}
.scoreboard table{width:100%}.scoreboard th{background:#153454}.scoreboard td,.scoreboard th{padding:11px 13px}
.scoreboard tr:nth-child(even){background:#ffffff07}
.classic-subtitle{font-weight:800;color:#f0cb77;margin:0 0 8px;letter-spacing:.02em}

@media(max-width:650px){.nav{position:sticky;top:0;z-index:7}.nav button{flex:none;min-width:102px;font-size:13px;padding:12px 9px}.club-home .stadium{height:265px}.stadium .stadium-overlay h2{font-size:23px}.classic-shortcuts{grid-template-columns:repeat(3,minmax(0,1fr))}.classic-shortcuts button{min-height:80px}.home-right{grid-template-columns:1fr}.head{min-height:75px}}

/* DIAMOND GM — light baseball management interface revision */
:root{color-scheme:light;--bg:#f4f7fb;--surface:#ffffff;--light:#edf3fa;--line:#dce5f0;--text:#1d3048;--muted:#6b7e94;--primary:#2665bd;--gold:#b67a16}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,#eaf2fc 0,#f7f9fd 225px,#f4f7fb 100%);color:var(--text);font-size:14px;line-height:1.6}
.shell{max-width:1380px;padding:0 clamp(16px,3.4vw,48px)}
.top{background:#fff;border-bottom:1px solid #dee7f1;box-shadow:0 2px 16px #1e46760d}
.head{min-height:88px;gap:24px}
.brand-logo{color:#244c7f;text-shadow:none;font-size:22px}
.brand-logo b{color:#244c7f}.brand-logo em{color:#2978bc}.brand-logo small{color:#738ca8}
.brand-logo .ball{background:#fff;box-shadow:0 0 0 3px #edf4fb,0 2px 8px #1a508922}
.stats{gap:10px;align-items:center}
.pill{background:#f5f8fc;border-color:#dde7f2;color:#344c68;border-radius:11px;padding:9px 13px}
button{border:1px solid #d1deeb;border-radius:10px;background:#f4f8fd;color:#2c4b6f;min-height:38px;font-weight:650;transition:background .15s,border-color .15s,transform .15s}
button:hover{background:#e7f2ff;border-color:#a9c8ee;filter:none}
button:active{transform:translateY(1px)}
.primary,.stadium .stadium-overlay button{background:#286bbb;color:#fff;border-color:#286bbb;box-shadow:0 3px 8px #286bbb28}
.primary:hover,.stadium .stadium-overlay button:hover{background:#17559e}
input,select{background:#fff;border:1px solid #cad7e7;color:#203853;border-radius:9px;min-height:40px}
input:focus,select:focus{outline:2px solid #8ab8f2;outline-offset:1px}
main{padding-top:24px}
.nav{margin:0 0 26px;background:#fff;border:1px solid #d9e4ef;border-radius:12px;gap:6px;padding:7px;box-shadow:0 3px 14px #1a4a7810}
.nav button{color:#536a83;font-size:14px;font-weight:700;min-width:105px;padding:13px 10px;border:0;border-radius:9px;background:transparent}
.nav button.active{color:#fff;background:#276cbd;border:0;box-shadow:0 3px 9px #276cbd36}
.nav button:not(.active):hover{background:#eef5fc}
.panel{background:#fff;border:1px solid #dce6f0;border-radius:15px;padding:clamp(17px,2vw,27px);box-shadow:0 5px 22px #1b456e0b;margin-bottom:20px}
.panel h3{font-size:17px;line-height:1.4;color:#233f5e;margin:0 0 16px}
.sectiontitle{font-size:22px;color:#1a3757;border-bottom:0;margin:3px 0 19px;padding:0;letter-spacing:-.03em}
.grid{gap:15px}
.metric{background:#f4f8fc;border:1px solid #e4ecf5;border-radius:12px;padding:18px;color:#5a718b}
.metric strong{color:#213a59;font-size:24px;margin-top:9px}
.item{gap:18px;border-bottom:1px solid #edf1f6;padding:13px 0}
.item b{color:#203b5b}
.muted,small{color:var(--muted)}
.grade{background:#e5ebf4;color:#445d7a}
.grade.A{background:#fff0cb;color:#98630b}
.grade.B{background:#d9f2f2;color:#12757c}
.grade.C{background:#e3eeff;color:#2e70ae}
.club-home{grid-template-columns:minmax(0,1.9fr) minmax(270px,.9fr);gap:21px}
.club-home .stadium{height:365px;border:1px solid #bcd3e6;border-radius:16px;background:
radial-gradient(ellipse 80% 29% at 50% 92%,#56a55f 0 55%,#328a53 56% 73%,transparent 74%),
linear-gradient(180deg,#8dc9f0 0,#c4e7fb 44%,#8fb9c4 44%,#d1dedc 48%,#2e7b50 49%,#26764a 100%);
box-shadow:0 10px 30px #2b53722b;position:relative}
.club-home .stadium::before{background:linear-gradient(135deg,#d8b784 0 12%,#68ae6b 12% 75%,#c59a69 75% 100%);border-color:#e4c89b;bottom:-115px}
.club-home .stadium::after{background:repeating-linear-gradient(90deg,#fff 0 3px,#f3faff 3px 5px,transparent 5px 12px);top:42%;opacity:.86}
.stadium .stadium-overlay{background:linear-gradient(90deg,#12395eeb 0,#12395ec9 33%,#12395e55 64%,transparent 100%);padding:clamp(22px,2.6vw,38px)}
.stadium .stadium-overlay h2{font-size:clamp(24px,2.8vw,35px);font-weight:850;color:white;line-height:1.25;max-width:500px;margin:19px 0}

.classic-subtitle{color:#ffe5a3;letter-spacing:.08em}

.home-right .panel{margin-bottom:15px}
.home-right h3{color:#2a496b;font-size:16px}
.scoreboard{background:#fff;border-color:#dee8f1;border-radius:12px}
.scoreboard th{background:#edf4fc;color:#486581}
.scoreboard td{color:#263e5c}
.scoreboard tr:nth-child(even){background:#f7faff}
table th,table td{border-bottom:1px solid #e7edf5;padding:12px 14px}

.card{background:#f5f9fd;border-color:#e1eaf4}
.auth{margin:7vh auto;max-width:460px}
.auth h1{color:#203e61}
.auth input{min-height:46px}

.msg{background:#fff;color:#234763;border-color:#a8c9e7;box-shadow:0 8px 32px #1b4b7840}

/* Franchise identity, original emblems, and pre-login team selector */
:root{--team-accent:#286bbb;--team-alt:#164d8a}
body{font-family:Inter,Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif}
button.primary,.primary,.nav button.active{background:var(--team-accent);border-color:var(--team-accent);color:white}
button.primary:hover,.primary:hover{background:var(--team-alt);border-color:var(--team-alt);color:white}
.nav button.active{box-shadow:0 4px 12px color-mix(in srgb,var(--team-accent) 30%,transparent)}
.stadium .stadium-overlay button{background:var(--team-accent);border-color:var(--team-accent)}
.stadium .stadium-overlay button:hover{background:var(--team-alt)}
.classic-shortcuts button:hover{border-color:var(--team-accent);color:var(--team-accent)}
.team-crest{display:inline-flex;align-items:center;justify-content:center;position:relative;width:77px;height:86px;flex:none;clip-path:polygon(50% 0%,96% 18%,93% 70%,50% 100%,7% 70%,4% 18%);background:linear-gradient(130deg,var(--crest-alt),var(--crest) 67%,var(--crest-alt));filter:drop-shadow(0 3px 4px #19334a26);color:#fff;box-shadow:inset 0 0 0 4px #fff8}
.team-crest::before{content:"";position:absolute;inset:6px;clip-path:inherit;border:2px solid #ffffff70;background:linear-gradient(150deg,#ffffff27,#ffffff00 55%);opacity:.85}
.crest-letter{font-size:38px;line-height:1;font-family:Georgia,serif;font-weight:950;font-style:italic;text-shadow:2px 3px 0 #0005;z-index:2}
.crest-light{position:absolute;top:8px;right:17px;font-size:11px;color:#ffebad;z-index:2}
.team-crest.small{width:30px;height:35px}
.team-crest.small .crest-letter{font-size:18px}
.team-crest.small .crest-light{display:none}
.header-team{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--team-accent) 8%,white);padding:5px 10px;border:1px solid color-mix(in srgb,var(--team-accent) 20%,white);border-radius:9px;color:var(--team-accent)}
.team-page{padding-top:32px;padding-bottom:80px}
.team-intro{text-align:center;max-width:780px;margin:0 auto 35px}

.team-choice::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--team-accent)}

.team-choice .team-info{display:flex;align-items:center;flex-direction:column;gap:3px;min-width:0}

.team-pick-arrow{font-weight:750;font-size:11px;color:var(--team-accent);margin-top:4px}
.team-disclaimer{text-align:center;font-size:12px;color:#8797a9;margin-top:25px}
.auth-layout{display:grid;grid-template-columns:1.05fr .9fr;gap:24px;align-items:stretch;max-width:1050px;margin:5vh auto}
.auth-showcase{border-radius:20px;background:linear-gradient(145deg,var(--team-alt) 0,var(--team-accent) 88%);color:white;min-height:490px;padding:50px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}

.auth-showcase p{font-size:17px;color:#fff;line-height:1.7}
.auth-showcase-desc{letter-spacing:.13em;font-size:10px;opacity:.75;margin-top:25px}
.auth-modern{margin:0;max-width:none;display:flex;flex-direction:column;justify-content:center;padding:clamp(25px,3vw,46px)}
.auth-modern h1{margin:12px 0 0;font-size:28px}
.auth-modern form{margin-top:20px}
.auth-modern form label{font-size:12px;font-weight:800;color:#46617b;display:block;margin:13px 0}
.auth-modern form input{width:100%;margin:6px 0 0}

</style></head><body><div id="app"></div><script>
const app=document.getElementById('app');let state={user:null,teams:[]},tab='home',filter='',marketPos='전체',grade='전체',sort='overall',selectedTeam=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const money=n=>Number(n||0).toLocaleString('ko-KR')+'원';const overall=p=>statNum((Number(p.power)+Number(p.contact)+Number(p.eye)+Number(p.speed)+Number(p.defense)+Number(p.mental??p.stamina??55))/6);
const statNum=n=>Math.min(99.99,Math.max(0,Number(n)||0)).toFixed(2);
const statColor=n=>Number(n)<50?'gray':Number(n)<70?'green':Number(n)<90?'blue':'red';
const statCell=n=>'<span class="stat-number stat-'+statColor(n)+'">'+statNum(n)+'%</span>';
const shortYear=p=>String(Number(p.year||2000)%100).padStart(2,'0');
const getAge=p=>Number.isInteger(p.age)?p.age:25;
const playerLabel=p=>shortYear(p)+String(p.name||'선수')+' ('+getAge(p)+'세)';
const playerButton=p=>'<button type="button" class="player-name-link" data-profile="'+esc(p.id)+'">'+esc(playerLabel(p))+'</button>';

const CONDITION_LEVELS=['','최악','악','중','강','최강'];
function conditionLabel(p){const n=Math.max(1,Math.min(5,Number(p.condition)||3));return '<span class="condition-label cl-'+n+'">'+(n<=2?'↓':n===3?'−':'↑')+' '+CONDITION_LEVELS[n]+'</span>'}
function playerPortrait(p,mode=''){
 const seed=Number(p.avatarSeed)||String(p.id||p.name).length*71;
 const hair=['#292c30','#383028','#3b302d','#16191e'][seed%4],skin=(p.foreign?['#bc8861','#8e5d43','#d9a27c']:['#edc4a0','#dbab81','#e6b795'])[seed%3],shirt=(state.teams||[]).find(t=>t.id===state.club?.teamId)?.color||'#285eab';
 const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 108"><defs><linearGradient id="f" x2="1" y2="1"><stop stop-color="'+skin+'"/><stop offset="1" stop-color="#a16a4c"/></linearGradient></defs><rect width="100" height="108" fill="#d7e6f5"/><path d="M-6 108Q4 78 50 78Q97 79 106 108" fill="'+shirt+'"/><path d="M38 80L50 99L62 80" fill="#fff"/><ellipse cx="50" cy="46" rx="28" ry="36" fill="url(#f)"/><path d="M22 41Q18 13 50 12Q82 11 78 42L66 29Q47 35 31 29Z" fill="'+hair+'"/><circle cx="39" cy="49" r="2" fill="#222"/><circle cx="62" cy="49" r="2" fill="#222"/><path d="M43 64Q50 68 58 64" fill="none" stroke="#8a5b43" stroke-width="2"/></svg>';
 return '<span class="player-portrait '+mode+'"><img alt="" src="data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)+'"></span>';
}
function friendlyResultModal(r){
 const overlay=document.createElement('div');overlay.className='friendly-result-overlay';overlay.innerHTML='<div class="friendly-result-card" role="dialog" aria-modal="true"><h2>'+({win:'🏆 승리',loss:'패배',draw:'무승부'}[r.outcome]||'결과')+'</h2><div class="friendly-final-score">'+r.ours+' : '+r.theirs+'</div><p>VS '+esc(r.opponent)+'</p><strong>'+(r.cash?'+'+money(r.cash):r.cp?'+'+r.cp+' CP':r.drinks?'🥤 스포츠음료 +'+r.drinks+'개':'보상 없음')+'</strong><h3>선수별 성적과 컨디션</h3><div class="friendly-stat-list">'+(r.playerStats||[]).map(p=>'<div>'+esc(p.name)+' <small>'+esc(p.summary)+'</small><b class="'+(p.delta>0?'raise':p.delta<0?'drop':'')+'">'+(p.delta>0?'↑ +1':p.delta<0?'↓ -1':'− 유지')+'</b></div>').join('')+'</div><button class="primary" id="closeFriendlyResult">확인</button></div>';document.body.appendChild(overlay);overlay.querySelector('#closeFriendlyResult').onclick=()=>overlay.remove();overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};
}

const fieldNames={contact:'정확',power:'파워',eye:'선구',speed:'주력',defense:'수비',mental:'정신'};
const g=p=>'<span class="grade '+esc(p.grade)+'">'+esc(p.grade)+'</span>';
function toast(txt){document.querySelector('.msg')?.remove();let x=document.createElement('div');x.className='msg';x.textContent=txt;document.body.append(x);setTimeout(()=>x.remove(),3500)}
async function api(body){try{const r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const x=await r.json();if(!r.ok)throw Error(x.error||'오류');const currentTeams=state.teams||[];state=x;if(!state.teams)state.teams=currentTeams;if(body.type==='logout')selectedTeam=null;if(x.result?.message&&!['scout','friendly'].includes(body.type))toast(x.result.message);render();if(body.type==='scout'&&x.result?.scouted)showScoutResult(x.result.scouted);if(body.type==='friendly'&&x.result?.friendly)friendlyResultModal(x.result.friendly)}catch(e){toast(e.message)}}
async function start(){try{state=await(await fetch('/api/state')).json()}catch(e){toast('서버에 연결할 수 없습니다')}render()}

function chosenTeam(){return (state.teams||[]).find(t=>t.id===(state.club?.teamId||state.user?.teamId||selectedTeam))||null}
function teamBadge(t,small=false){return '<span class="team-crest '+(small?'small':'')+'" style="--crest:'+esc(t.color)+';--crest-alt:'+esc(t.secondary)+'"><span class="crest-light">✦</span><span class="crest-letter">'+esc(t.symbol)+'</span></span>'}
function theme(){const t=chosenTeam();const root=document.documentElement;if(t){root.style.setProperty('--team-accent',t.color);root.style.setProperty('--team-alt',t.secondary)}else{root.style.setProperty('--team-accent','#286bbb');root.style.setProperty('--team-alt','#164d8a')}}
function selectTeam(){
  theme();
  app.innerHTML='<header class="top"><div class="shell head">'+logo+'<span class="muted">당신의 구단을 선택하세요</span></div></header>'+
  '<main class="shell team-page"><div class="team-intro"><span class="team-eyebrow">CHOOSE YOUR FRANCHISE</span><h1>어느 구단의 감독이 되시겠습니까?</h1><p>10개 구단 중 하나를 선택하고 구단주로 출발하세요. 구단의 대표색이 게임 전체에 적용됩니다.</p></div>'+
  '<div class="team-picker">'+(state.teams||[]).map(t=>'<button type="button" class="team-choice" data-team="'+esc(t.id)+'" style="--team-accent:'+esc(t.color)+';--team-alt:'+esc(t.secondary)+'">'+teamBadge(t)+'<span class="team-info"><small>'+esc(t.city)+' · '+esc(t.mascot)+'</small><strong>'+esc(t.name)+'</strong></span><span class="team-pick-arrow">선택하기 →</span></button>').join('')+'</div>'+
  '<p class="team-disclaimer">가상의 구단 명칭과 독자적으로 제작한 엠블럼을 사용합니다. 특정 프로구단의 공식 로고가 아닙니다.</p></main>';
  document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>{selectedTeam=b.dataset.team;login()});
}
let authMode='login',checkedUsername='';
function login(){
 const t=chosenTeam();if(!t)return selectTeam();theme();
 const signup=authMode==='register';
 app.innerHTML='<header class="top"><div class="shell head">'+logo+'<button id="backTeams" class="light-button">← 구단 다시 선택</button></div></header>'+
 '<main class="shell"><div class="auth-layout"><div class="auth-showcase" style="--team-accent:'+esc(t.color)+';--team-alt:'+esc(t.secondary)+'">'+teamBadge(t)+'<div class="auth-showcase-title">'+esc(t.name)+'</div><p>새로운 시즌, 새로운 역사<br>당신이 직접 만들어갈 차례입니다.</p><span class="auth-showcase-desc">TEAM IDENTITY · '+esc(t.city)+'</span></div>'+
 '<div class="panel auth auth-modern"><span class="team-eyebrow">WELCOME TO DIAMOND GM</span><h1>'+(signup?'구단주 회원가입':'구단주 로그인')+'</h1><p class="muted">선택한 구단: <b>'+esc(t.name)+'</b></p><form id="auth">'+
 '<label>아이디<div class="auth-id-row"><input id="usernameInput" type="text" name="username" inputmode="text" autocomplete="username" placeholder="아이디 (3~20자)" required minlength="3" maxlength="20" spellcheck="false">'+(signup?'<button id="checkId" type="button" class="light-button">중복 확인</button>':'')+'</div></label>'+
 (signup?'<p id="idFeedback" class="auth-feedback">아이디 중복 확인을 진행해 주세요.</p><label>구단주명<input id="ownerNameInput" name="ownerName" type="text" maxlength="16" minlength="2" placeholder="구단주명 (2~16자)" autocomplete="nickname" required></label>':'')+
 '<label>비밀번호<input name="password" autocomplete="'+(signup?'new-password':'current-password')+'" placeholder="'+(signup?'특수문자 포함 8자 이상':'비밀번호')+'" type="password" required '+(signup?'minlength="8"':'')+'></label>'+
 (signup?'<p class="auth-help">비밀번호는 특수문자(!, @, # 등)를 포함해 8자 이상 입력하세요.</p><label>비밀번호 확인<input name="passwordConfirm" type="password" autocomplete="new-password" placeholder="비밀번호 다시 입력" required minlength="8"></label>':'')+
 '<button type="button" class="primary" id="submitAuth">'+(signup?'회원가입 완료':'로그인')+'</button><button type="button" class="light-button" id="changeAuth">'+(signup?'기존 계정으로 로그인':'새 구단주로 회원가입')+'</button></form><p class="muted" style="margin-top:22px;font-size:12px">가입한 계정은 선택한 구단에 연결됩니다. 테스트 데이터는 초기화될 수 있습니다.</p></div></div></main>';
 document.getElementById('backTeams').onclick=()=>{selectedTeam=null;authMode='login';checkedUsername='';selectTeam()};
 document.getElementById('changeAuth').onclick=()=>{authMode=signup?'login':'register';checkedUsername='';login()};
 const form=document.getElementById('auth'),id=document.getElementById('usernameInput');
 if(signup){
   id.addEventListener('input',()=>{checkedUsername='';const e=document.getElementById('idFeedback');e.textContent='중복 확인을 진행해 주세요.';e.className='auth-feedback'});
   document.getElementById('checkId').onclick=async()=>{
    const value=id.value.trim();if(!/^[a-zA-Z0-9가-힣_]{3,20}$/.test(value)){toast('아이디는 한글·영문·숫자·밑줄로 3~20자 입력하세요');return}
    try{const response=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'checkUsername',username:value})});const result=await response.json();if(!response.ok)throw Error(result.error||'중복 확인 실패');
      const fb=document.getElementById('idFeedback');if(result.available){checkedUsername=value;fb.textContent='사용 가능한 아이디입니다.';fb.className='auth-feedback ok'}else{checkedUsername='';fb.textContent='이미 사용 중인 아이디입니다. 다른 아이디를 입력해 주세요.';fb.className='auth-feedback invalid'}
    }catch(e){checkedUsername='';toast(e.message)}
   }
 }
 document.getElementById('submitAuth').onclick=()=>{
  if(!form.reportValidity())return;
  const username=id.value.trim(),password=form.querySelector('input[name="password"]').value;
  if(signup){
   if(checkedUsername!==username){toast('아이디 중복 확인을 먼저 완료해 주세요');return}
   if(password.length<8||!/[^a-zA-Z0-9가-힣]/.test(password)){toast('비밀번호는 특수문자를 포함해 8자 이상 입력하세요');return}
   if(password!==form.querySelector('input[name="passwordConfirm"]').value){toast('비밀번호 확인이 일치하지 않습니다');return}const ownerName=document.getElementById('ownerNameInput').value.trim();if(ownerName.length<2||ownerName.length>16){toast('구단주명은 2~16자로 입력해 주세요');return}
  }
  api({type:signup?'register':'login',teamId:t.id,username,password,ownerName:signup?document.getElementById('ownerNameInput').value.trim():undefined});
 };
}

const LINEUP_POSITIONS=[['CF','중견수',50,19],['LF','좌익수',17,34],['RF','우익수',83,34],['SS','유격수',36,53],['2B','2루수',64,53],['3B','3루수',24,69],['1B','1루수',76,69],['C','포수',50,87],['DH','지명타자',88,88]];
let lineupDraft=null;
function initLineupDraft(club){
 if(lineupDraft?.clubId===club.id)return;
 const batting=(club.lineup||[]).slice(0,9);
 const current=club.defensePositions||{};
 const used=new Set(),defense={};
 const native={'포수':'C','1루수':'1B','2루수':'2B','3루수':'3B','유격수':'SS','좌익수':'LF','중견수':'CF','우익수':'RF'};
 for(const [pos] of LINEUP_POSITIONS){const id=current[pos];if(id&&batting.includes(id)&&!used.has(id)){defense[pos]=id;used.add(id)}}
 for(const id of batting){const p=club.players.find(p=>p.id===id);const pos=native[p?.pos];if(pos&&!used.has(id)&&!defense[pos]){defense[pos]=id;used.add(id)}}
 for(const [pos] of LINEUP_POSITIONS)if(!defense[pos]){const id=batting.find(id=>!used.has(id));if(id){defense[pos]=id;used.add(id)}}
 const available=club.players.filter(p=>p.isPitcher),chosen=new Set(),pitchers={};
 for(const role of ['starter','relief','closer']){
  const id=club.pitcherAssignments?.[role]||(role==='starter'?club.pitcher:null);
  if(available.some(p=>p.id===id)&&!chosen.has(id)){pitchers[role]=id;chosen.add(id)}
 }
 for(const role of ['starter','relief','closer'])if(!pitchers[role]){const p=available.find(p=>!chosen.has(p.id));if(p){pitchers[role]=p.id;chosen.add(p.id)}}
 lineupDraft={clubId:club.id,batting,defense,pitchers,dirty:false};
}
function setBattingPlayer(slot,id){
 const d=lineupDraft;if(!d)return;
 const old=d.batting[slot],other=d.batting.indexOf(id);
 if(other>=0)d.batting[other]=old;
 d.batting[slot]=id;
 if(other<0)for(const pos of Object.keys(d.defense))if(d.defense[pos]===old)d.defense[pos]=id;
 d.dirty=true;renderLineup();
}
function setDefensePlayer(pos,id){
 const d=lineupDraft;if(!d||!d.batting.includes(id))return;
 const old=d.defense[pos];const existing=Object.keys(d.defense).find(key=>d.defense[key]===id);
 if(existing&&existing!==pos)d.defense[existing]=old;
 d.defense[pos]=id;d.dirty=true;renderLineup();
}
function setPitcherRole(role,id){
 const d=lineupDraft;if(!d)return;
 const other=Object.keys(d.pitchers).find(x=>d.pitchers[x]===id);
 if(other&&other!==role)d.pitchers[other]=d.pitchers[role];
 d.pitchers[role]=id;d.dirty=true;renderLineup();
}
function lineupOption(p,id){return '<option value="'+esc(p.id)+'" '+(p.id===id?'selected':'')+'>'+esc(playerLabel(p))+' · '+overall(p)+' · '+esc(p.pos)+'</option>'}

 const starter=byId(d.pitchers.starter);
 el.innerHTML='<div class="lineup-page-title"><div><span class="team-eyebrow">TEAM LINEUP · FIELD & BATTING ORDER</span><h2 class="sectiontitle">라인업 관리</h2><p class="muted">수비 포지션 · 타순 · 교체 선수 · 투수진을 한 화면에서 관리하세요.</p></div><button id="lineupSave" class="primary" '+(!d.dirty?'disabled':'')+'>✓ 변경사항 저장</button></div>'+
 '<div class="lineup-workspace"><div class="lineup-field-column"><div class="lineup-field-head"><strong>🏟️ 선발 수비 배치도</strong><span>수비 카드를 누르면 오른쪽에서 변경할 수 있습니다</span></div><div class="lineup-field"><div class="lineup-crowd"></div><div class="lineup-turf"></div><div class="lineup-infield"><div class="lineup-diamond-shape"></div></div><div class="lineup-pitch-mound"></div><div class="lineup-foul foul-left"></div><div class="lineup-foul foul-right"></div>'+cards+'<button type="button" class="diamond-position pitcher-pin" data-focus-position="starter" style="left:50%;top:69%"><span class="diamond-pos-label">SP</span><span class="diamond-player-name">'+(starter?esc(playerLabel(starter)):'미지정')+'</span><span class="diamond-player-grade">'+(starter?esc(starter.grade):'-')+' · '+(starter?overall(starter):'-')+'</span></button></div><div class="lineup-field-summary"><span>타선 평균 <strong>'+statNum(d.batting.reduce((sum,id)=>sum+(Number(byId(id)?.power)||0),0)/9)+'%</strong></span><span>수비 평균 <strong>'+statNum(d.batting.reduce((sum,id)=>sum+(Number(byId(id)?.defense)||0),0)/9)+'%</strong></span><span>선발 투수 <strong>'+(starter?overall(starter):'-')+'</strong></span></div><p class="lineup-help">* 야구장 배치는 실제 3D 렌더가 아닌 입체감을 적용한 게임용 필드입니다.</p></div>'+
 '<div class="lineup-editor"><div class="lineup-editor-panel"><div class="lineup-editor-head"><h3>① 타선 · 1~9번</h3><span>'+d.batting.length+'/9명</span></div><div class="lineup-edit-list">'+d.batting.map((id,i)=>'<div class="lineup-edit-row"><span class="lineup-order">'+(i+1)+'</span><select data-batting="'+i+'" aria-label="'+(i+1)+'번 타자 선택">'+bats.map(p=>lineupOption(p,id)).join('')+'</select></div>').join('')+'</div></div>'+
 '<div class="lineup-editor-panel"><div class="lineup-editor-head"><h3>② 수비 포지션</h3><span>선발 9명 배치</span></div><div class="lineup-edit-list lineup-defense-list">'+LINEUP_POSITIONS.map(([pos,label])=>'<div class="lineup-edit-row"><span class="lineup-pos-tag">'+pos+'</span><select data-defense="'+pos+'" aria-label="'+label+' 선택">'+d.batting.map(id=>byId(id)).filter(Boolean).map(p=>lineupOption(p,d.defense[pos])).join('')+'</select></div>').join('')+'</div></div>'+
 '<div class="lineup-editor-panel"><div class="lineup-editor-head"><h3>③ 교체 선수</h3><span>벤치 '+bench.length+'명</span></div><div class="lineup-bench-list">'+(bench.length?bench.map(p=>'<div class="lineup-bench-row"><div><b>'+esc(playerLabel(p))+'</b><small>'+esc(p.pos)+' · '+g(p)+' · '+overall(p)+'</small></div><select data-bench="'+p.id+'" aria-label="'+esc(p.name)+' 교체할 타순 선택"><option value="">타순 교체</option>'+d.batting.map((_,i)=>'<option value="'+i+'">'+(i+1)+'번 교체</option>').join('')+'</select></div>').join(''):'<p class="muted">교체 가능한 타자가 없습니다.</p>')+'</div></div>'+
 '<div class="lineup-editor-panel"><div class="lineup-editor-head"><h3>④ 투수 라인업</h3><span>선발 · 중계 · 마무리</span></div><div class="lineup-edit-list">'+[['starter','선발 SP'],['relief','중계 RP'],['closer','마무리 CP']].map(([role,label])=>'<div class="lineup-edit-row"><span class="lineup-pitch-label">'+label+'</span><select data-pitch-role="'+role+'" aria-label="'+label+' 선택">'+pitch.map(p=>lineupOption(p,d.pitchers[role])).join('')+'</select></div>').join('')+'</div>'+(reserve.length?'<div class="lineup-reserves"><strong>대기 투수 '+reserve.length+'명</strong><div>'+reserve.map(p=>'<span>'+esc(playerLabel(p))+' ('+overall(p)+')</span>').join('')+'</div></div>':'')+'</div>'+
 '<div class="lineup-editor-actions"><button id="lineupReset">초기화</button><button id="lineupAuto">자동 배치</button><button id="lineupSaveBottom" class="primary" '+(!d.dirty?'disabled':'')+'>✓ 라인업 저장</button></div></div></div>';
 document.querySelectorAll('[data-batting]').forEach(x=>x.onchange=()=>setBattingPlayer(Number(x.dataset.batting),x.value));
 document.querySelectorAll('[data-defense]').forEach(x=>x.onchange=()=>setDefensePlayer(x.dataset.defense,x.value));
 document.querySelectorAll('[data-pitch-role]').forEach(x=>x.onchange=()=>setPitcherRole(x.dataset.pitchRole,x.value));
 document.querySelectorAll('[data-bench]').forEach(x=>x.onchange=()=>{if(x.value!=='')setBattingPlayer(Number(x.value),x.dataset.bench)});
 document.querySelectorAll('[data-focus-position]').forEach(b=>b.onclick=()=>{const target=document.querySelector(b.dataset.focusPosition==='starter'?'[data-pitch-role="starter"]':'[data-defense="'+b.dataset.focusPosition+'"]');target?.scrollIntoView({behavior:'smooth',block:'center'});target?.focus()});
 const save=async()=>{const data={type:'saveLineup',batting:[...d.batting],defense:{...d.defense},pitchers:{...d.pitchers}};lineupDraft=null;await api(data);};

function scoutPopup(content){
 closeScoutPopup();
 const overlay=document.createElement('div');
 overlay.id='scoutPopup';overlay.className='scout-popup-overlay';
 overlay.innerHTML='<div class="scout-popup-dialog" role="dialog" aria-modal="true" aria-labelledby="scoutPopupTitle">'+content+'</div>';
 document.body.appendChild(overlay);
 overlay.addEventListener('click',e=>{if(e.target===overlay)closeScoutPopup()});
 overlay.querySelector('[data-popup-close]')?.addEventListener('click',closeScoutPopup);
 overlay.querySelector('[data-popup-close]')?.focus();
}

function showScoutResult(p){
 const statMarkup=Object.keys(fieldNames).map(k=>'<div class="scout-result-stat"><span>'+esc(fieldNames[k])+'</span>'+statCell(p[k]??(k==='mental'?p.stamina:55))+'</div>').join('');
 scoutPopup('<div class="scout-popup-header"><span>NEW PLAYER SIGNED</span><button type="button" data-popup-close aria-label="닫기">✕</button></div><div class="scout-popup-body"><div class="scout-popup-emblem signed">★</div><div class="scout-result-eyebrow">영입 성공</div><h2 id="scoutPopupTitle">'+esc(playerLabel(p))+'</h2><p class="scout-popup-caption">'+esc(p.pos)+' · '+g(p)+' · 종합 '+statCell(overall(p))+'</p><div class="scout-result-stats">'+statMarkup+'</div><div class="scout-popup-actions"><button type="button" data-popup-close>닫기</button><button type="button" id="scoutViewPlayer" class="primary">선수 정보 보기</button></div></div>');
 document.getElementById('scoutViewPlayer').onclick=()=>{closeScoutPopup();openPlayerProfile(p)};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeScoutPopup()});

function findPlayerProfile(id){const club=state.club;return (club?.players||[]).find(p=>p.id===id)||(state.listings||[]).map(l=>l.player).find(p=>p.id===id)||(club?.scoutHistory||[]).map(h=>h.player).find(p=>p.id===id)||null}
function openPlayerProfile(p){
 if(!p)return;
 document.getElementById('playerProfileOverlay')?.remove();
 const t=(state.teams||[]).find(x=>x.id===p.originTeam)||(state.teams||[]).find(x=>x.id===state.club?.teamId);
 const overlay=document.createElement('div');overlay.id='playerProfileOverlay';overlay.className='player-profile-overlay';
 overlay.innerHTML='<div class="player-profile-card" role="dialog" aria-modal="true" aria-label="선수 상세 정보"><div class="player-profile-top"><span>PLAYER INFORMATION</span><button type="button" class="close-profile" aria-label="닫기">✕</button></div><div class="player-profile-overview">'+playerPortrait(p,'large')+'<div><div class="player-profile-role">'+esc(p.pos)+' · '+shortYear(p)+' 시즌</div><h2>'+esc(playerLabel(p))+'</h2><div class="player-profile-meta">'+conditionLabel(p)+' '+g(p)+' <span>종합 '+statCell(overall(p))+'</span><span>'+(t?esc(t.name):'가상 선수')+'</span></div></div></div><div class="player-growth-info"><strong>기본 성장</strong> · '+esc(fieldNames[p.growthFocus]||'정확')+' +0.02 / 구단 경기 1회 <small>(A~E 공통 · 비출전 포함)</small><br><strong>출전 성장</strong> · '+(p.grade==='A'&&p.age>=36?'36세부터 A등급 출전 성장 중단':'등급·나이에 따라 출전 선수만 추가 성장')+'</div><div class="player-profile-stats"><h3>선수 능력치</h3>'+Object.keys(fieldNames).map(k=>{const val=Number(p[k]??(k==='mental'?p.stamina:55))||0;return '<div class="player-profile-stat"><span>'+fieldNames[k]+'</span><div class="player-profile-bar stat-bg-'+statColor(val)+'"><div style="width:'+Math.min(100,val)+'%"></div></div><strong>'+statCell(val)+'</strong></div>'}).join('')+'</div><div class="player-profile-bottom"><span>연도 '+shortYear(p)+' · 나이 '+getAge(p)+'세 · '+esc(p.pos)+'</span><button type="button" class="close-profile">닫기</button></div></div>';
 document.body.appendChild(overlay);const close=()=>overlay.remove();overlay.addEventListener('click',e=>{if(e.target===overlay)close()});overlay.querySelectorAll('.close-profile').forEach(b=>b.onclick=close);overlay.querySelector('.close-profile').focus();
}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-profile]');if(btn){e.preventDefault();e.stopPropagation();openPlayerProfile(findPlayerProfile(btn.dataset.profile))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('playerProfileOverlay')?.remove()});

function render(){theme();if(!state.user)return selectedTeam?login():selectTeam();if(!state.club)return create();root()}start();
</script></body></html>
